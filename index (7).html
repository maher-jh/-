  <style>
:root {
  --bg: #f5f6fb; --card: #fff; --ink: #1c1d2b; --muted: #6a6d85; --line: #e1e3ef;
  --primary: #4f46e5; --primary-ink: #fff; --danger: #d9304f; --ok: #12805c; --warn: #b26a00;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #14151f; --card: #1d1f2e; --ink: #eceef8; --muted: #9a9db8; --line: #2c2f45;
    --primary: #7c74ff; --primary-ink: #11121c; --danger: #ff6b86; --ok: #4fd1a1; --warn: #f0b458; }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.7 "Segoe UI", Tahoma, "Noto Naskh Arabic", system-ui, sans-serif; }
.topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between;
  gap: 8px; padding: 10px 16px; background: var(--card); border-bottom: 1px solid var(--line); }
.brand { font-weight: 700; color: var(--ink); text-decoration: none; font-size: 1.05rem; }
.container { max-width: 860px; margin: 0 auto; padding: 16px; padding-bottom: 80px; }
h1 { font-size: 1.4rem; margin: 8px 0 16px; }
h2 { font-size: 1.1rem; margin: 0 0 10px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.between { justify-content: space-between; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 4px; }
input, select, textarea { width: 100%; font: inherit; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
input:focus, select:focus, textarea:focus, button:focus-visible, a:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
textarea { min-height: 260px; resize: vertical; line-height: 1.9; }
.field { margin-bottom: 12px; }
.hint { color: var(--muted); font-size: .85rem; margin-top: 4px; }
.err { color: var(--danger); font-size: .85rem; margin-top: 4px; }
button, .btn { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  border-radius: 10px; padding: 9px 16px; text-decoration: none; display: inline-block; }
button.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); font-weight: 700; }
button.danger { color: var(--danger); }
button:disabled { opacity: .55; cursor: not-allowed; }
.chip { border-radius: 999px; padding: 4px 12px; font-size: .85rem; }
.project { display: block; color: inherit; text-decoration: none; }
.project:hover { border-color: var(--primary); }
.meta { color: var(--muted); font-size: .85rem; }
.tag { display: inline-block; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 0 10px; font-size: .8rem; margin-inline-end: 6px; }
.empty { text-align: center; padding: 36px 16px; color: var(--muted); }
.toast { position: fixed; bottom: 20px; inset-inline: 16px; margin: auto; max-width: 420px; background: var(--ink); color: var(--bg);
  padding: 12px 16px; border-radius: 12px; text-align: center; z-index: 20; }
.toast.bad { background: var(--danger); color: #fff; }
dialog { border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); color: var(--ink); max-width: min(92vw, 520px); width: 100%; padding: 18px; }
dialog::backdrop { background: rgba(0, 0, 0, .5); }
.tool { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.ok { color: var(--ok); font-weight: 700; } .no { color: var(--warn); font-weight: 700; }
.phase { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: .92rem; }
.savebar { position: sticky; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 10px 16px;
  margin: 0 -16px; display: flex; gap: 10px; justify-content: space-between; align-items: center; }

/* المرحلة 2: تحليل القصة */
button.sm { padding: 6px 12px; font-size: .9rem; min-height: 40px; }
button, select, input[type=checkbox] { touch-action: manipulation; }
select, input, textarea { font-size: 16px; min-height: 42px; }
.sub { margin-top: 16px; } .sub h3 { margin: 0 0 8px; font-size: 1.05rem; } .sub h4 { margin: 12px 0 6px; font-size: .95rem; }
.line { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 8px; padding: 8px; background: var(--bg); border-radius: 10px; }
.line > input, .line > textarea { flex: 1 1 100%; } .line > select { flex: 1 1 120px; }
details.scene { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; }
details.scene > summary { cursor: pointer; font-weight: 700; min-height: 40px; display: flex; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-check { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-weight: 400; margin: 0; }
.chip-check input { width: 20px; height: 20px; min-height: 0; margin: 0; }
.warns { color: var(--warn); font-size: .9rem; padding-inline-start: 20px; margin: 8px 0; }
.hint.warn { color: var(--warn); }
@media (max-width: 480px) { .container { padding: 12px; } .card { padding: 12px; } .savebar { flex-wrap: wrap; } }

/* المرحلة 3: استوديو الشخصيات */
.topnav { display: flex; gap: 6px; }
.topnav .chip { color: var(--ink); text-decoration: none; border: 1px solid var(--line); background: var(--card); }
.char-canvas { display: block; width: 100%; max-width: 360px; height: auto; margin: 0 auto 10px; border-radius: 12px; border: 1px solid var(--line); }
.char-top { text-align: center; }
.char-top .row { justify-content: center; }
.color-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.color-cell { display: flex; align-items: center; justify-content: space-between; gap: 6px; background: var(--bg); border-radius: 10px; padding: 6px 8px; }
.color-cell label { margin: 0; font-weight: 400; font-size: .85rem; }
.color-cell input[type=color] { width: 44px; height: 36px; min-height: 36px; padding: 2px; border-radius: 8px; cursor: pointer; }
input[type=range] { width: 100%; min-height: 36px; }
.hint.ok { color: var(--ok); }

/* ---------- المرحلة 4: الحركات والمعاينة ---------- */
.clip-group { margin: 16px 0 4px; }
.clip-group h3 { margin: 0 0 8px; font-size: 1rem; }
.clip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.clip-btn { padding: 10px 8px; border: 1px solid var(--line, #d0d7de); border-radius: 10px; background: var(--card, #fff); color: inherit; font: inherit; cursor: pointer; min-height: 44px; }
.clip-btn.on { border-color: var(--accent, #2f7de1); background: var(--accent-soft, #e6f0ff); font-weight: 700; }
.motion-canvas, .film-canvas { width: 100%; height: auto; max-width: 640px; display: block; margin: 8px auto; }
.player { margin: 8px 0; align-items: center; flex-wrap: wrap; }
.player button { min-height: 44px; min-width: 44px; }
.scene-jump { min-height: 40px; border: 1px solid var(--line, #d0d7de); cursor: pointer; font: inherit; }
.scene-jump.on { border-color: var(--accent, #2f7de1); background: var(--accent-soft, #e6f0ff); }
.hint.warn { color: var(--danger, #b42318); }
input[type=range] { width: 100%; }

/* ---------- المرحلة 5: الأصوات ---------- */
.subtitle { min-height: 2.2em; margin: 6px 0; text-align: center; font-weight: 600; }
.voice-row { border-top: 1px solid var(--line); padding: 10px 0; }
.voice-ctl { display: grid; gap: 6px; margin-top: 6px; }
.voice-ctl label { display: grid; gap: 4px; margin: 0; }
details.card > summary { cursor: pointer; font-weight: 700; min-height: 44px; display: flex; align-items: center; }
.hint.ok { color: var(--ok, #1a7f4b); }


/* ---------- المراحل 6–10 ---------- */
.topbar { flex-wrap: wrap; }
.topnav { order: 3; flex: 1 0 100%; flex-wrap: nowrap; overflow-x: auto; white-space: nowrap; padding-bottom: 2px; }
.topnav .chip { flex: none; }
.board-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); margin: 10px 0; }
.shot-card { border: 1px solid var(--line); border-radius: 12px; padding: 8px; background: var(--bg); }
.shot-card canvas.thumb { width: 100%; height: auto; border-radius: 8px; display: block; margin-bottom: 6px; border: 1px solid var(--line); }
.shot-card .field-row { display: grid; gap: 6px; margin: 6px 0; }
.shot-card .row { margin-top: 6px; }
.print-note { display: none; font-size: 12px; }
.tl-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); margin-top: 8px; }
.tl-inner { position: relative; min-width: 100%; padding: 0 0 10px; cursor: pointer; }
.tl-ruler { position: relative; height: 22px; border-bottom: 1px solid var(--line); }
.tl-tick { position: absolute; top: 0; height: 22px; font-size: .7rem; color: var(--muted); padding-inline-start: 3px; border-inline-start: 1px solid var(--line); white-space: nowrap; }
.tl-label { font-size: .72rem; color: var(--muted); padding: 4px 6px 0; position: sticky; inset-inline-start: 0; }
.tl-row { position: relative; height: 34px; margin: 2px 0; }
.tl-row.short { height: 22px; }
.tl-block { position: absolute; top: 0; height: 100%; min-height: 0; padding: 2px 4px; border: 1px solid rgba(0,0,0,.25); border-radius: 6px; overflow: hidden; font-size: .72rem; line-height: 1.4; white-space: nowrap; color: var(--primary-ink); text-align: start; }
.tl-block.sc { background: var(--primary); }
.tl-block.sc.alt { filter: brightness(1.2); }
.tl-block.shot { background: var(--card); color: var(--ink); text-align: center; padding: 0 2px; }
.tl-block.dl { border: none; opacity: .9; }
.tl-playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--danger); pointer-events: none; z-index: 2; }
.scene-edit { display: grid; gap: 8px; grid-template-columns: 1fr; }
.ref-img { display: block; width: 100%; max-width: 256px; margin: 8px auto; border-radius: 12px; border: 1px solid var(--line); }
.test-bad { color: var(--danger); font-weight: 700; }
progress { width: 100%; height: 14px; }
@media print {
  .topbar, .savebar, .noprint, .shot-card select, .shot-card input, .shot-card button, #toast { display: none !important; }
  .print-note { display: block; }
  body { background: #fff; color: #000; }
  .card, .shot-card { break-inside: avoid; border-color: #bbb; }
  .board-grid { grid-template-columns: repeat(3, 1fr); }
}
  
/* ===== مظهر حيوي: ألوان وحركات ===== */
:root { --grad: linear-gradient(135deg, #7c3aed 0%, #ec4899 55%, #f59e0b 100%); --glow: 0 6px 22px rgba(124,58,237,.35); }
body { background: radial-gradient(900px 500px at 85% -10%, rgba(124,58,237,.22), transparent 60%), radial-gradient(800px 500px at 0% 10%, rgba(236,72,153,.16), transparent 60%), var(--bg); background-attachment: fixed; }
.topbar { background: linear-gradient(90deg, rgba(124,58,237,.35), rgba(236,72,153,.25), rgba(245,158,11,.22)), var(--card); background-size: 200% 100%; border-bottom: 1px solid rgba(236,72,153,.35); }
.brand { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.card { border-color: rgba(124,58,237,.25); box-shadow: 0 2px 14px rgba(0,0,0,.18); }
button, .btn { transition: transform .15s ease, box-shadow .2s ease, filter .2s ease; }
button:active, .btn:active { transform: scale(.96); }
button.primary, .btn.primary { background: var(--grad); color: #fff; border: 0; box-shadow: var(--glow); }
button.primary:hover, .btn.primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
.film-canvas, .char-canvas { border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.35), 0 0 0 1px rgba(236,72,153,.25); }
progress, input[type=range] { accent-color: #ec4899; }
@media (prefers-reduced-motion: no-preference) {
  .topbar { animation: kasShift 12s ease-in-out infinite alternate; }
  @keyframes kasShift { to { background-position: 100% 0; } }
  #app > * { animation: kasIn .45s ease both; }
  #app > *:nth-child(2) { animation-delay: .06s; }
  #app > *:nth-child(3) { animation-delay: .12s; }
  @keyframes kasIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .card:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(124,58,237,.25); }
  .card { transition: transform .2s ease, box-shadow .2s ease; }
}
</style>

  <script>
// طبقة التخزين المحلية للنسخة المستقلة (index.html). تحاكي نفس واجهة /api في الخادم الأصلي
// لكن تحفظ المشاريع داخل المتصفح (localStorage) بدل SQLite ومجلدات الجهاز.
"use strict";

const KAS_OPTIONS = {
  genres: { adventure: "مغامرة", educational: "تعليمية", moral: "قصة بعبرة", comedy: "مرحة", fantasy: "خيالية", animals: "حيوانات" },
  age_groups: { "3-5": "٣ – ٥ سنوات", "6-8": "٦ – ٨ سنوات", "9-12": "٩ – ١٢ سنة" },
  styles: { soft3d: "كرتون ثلاثي الأبعاد ناعم", lowpoly: "Low-poly", clay: "صلصال" },
  aspect_ratios: { "16:9": "أفقي 16:9", "9:16": "عمودي 9:16", "1:1": "مربع 1:1" },
  duration: { min: 10, max: 3600 },
};
const KAS_SUBDIRS = ["story", "script", "characters", "models", "scenes", "audio", "videos", "references"];
const KAS_MAX_STORY = 200000;
const KAS_KEY = "kas.projects.v1";
const KAS_FIELDS = ["title", "description", "story", "genre", "age_group", "duration_sec", "style", "aspect_ratio"];

function kasFail(message, details) {
  const e = new Error(message);
  e.details = details || [];
  return e;
}

// ---------- التخزين ----------
let kasMemory = null;      // يُستخدم فقط إن تعذّر الوصول للتخزين الدائم
let kasPersistent = true;

function kasNormalize(db) {
  db.projects = db.projects || [];
  db.nextId = db.nextId || 1;
  db.chars = db.chars || [];          // مكتبة الشخصيات (المرحلة 3)
  db.nextCharId = db.nextCharId || 1;
  return db;
}

function kasLoad() {
  if (kasMemory) return kasMemory;
  try {
    const raw = localStorage.getItem(KAS_KEY);
    return kasNormalize(raw ? JSON.parse(raw) : { nextId: 1, projects: [] });
  } catch (e) {
    kasPersistent = false;
    kasMemory = kasNormalize({ nextId: 1, projects: [] });
    return kasMemory;
  }
}

function kasSave(db) {
  if (kasMemory) { kasMemory = db; return; }
  try {
    localStorage.setItem(KAS_KEY, JSON.stringify(db));
  } catch (e) {
    kasPersistent = false;   // الامتلاء أو المنع: نكمل بالذاكرة ونُنبّه المستخدم
    kasMemory = db;
    throw kasFail("تعذّر الحفظ الدائم في المتصفح. ستبقى البيانات حتى إغلاق الصفحة فقط.");
  }
}

// ---------- التحقق (نفس قواعد الخادم) ----------
function kasValidate(d) {
  const errs = [];
  const bad = (field, message) => errs.push({ field, message });
  const title = typeof d.title === "string" ? d.title.trim() : "";
  if (!title) bad("title", "العنوان مطلوب");
  else if (title.length > 120) bad("title", "العنوان أطول من 120 حرفًا");
  if (typeof d.description !== "string" || d.description.length > 2000) bad("description", "الوصف أطول من 2000 حرف");
  if (typeof d.story !== "string" || d.story.length > KAS_MAX_STORY) bad("story", "القصة أطول من الحد المسموح");
  if (!(d.genre in KAS_OPTIONS.genres)) bad("genre", "نوع القصة غير مدعوم");
  if (!(d.age_group in KAS_OPTIONS.age_groups)) bad("age_group", "الفئة العمرية غير مدعومة");
  if (!(d.style in KAS_OPTIONS.styles)) bad("style", "أسلوب الأنيميشن غير مدعوم");
  if (!(d.aspect_ratio in KAS_OPTIONS.aspect_ratios)) bad("aspect_ratio", "نسبة الفيديو غير مدعومة");
  const { min, max } = KAS_OPTIONS.duration;
  if (!Number.isInteger(d.duration_sec) || d.duration_sec < min || d.duration_sec > max)
    bad("duration_sec", `المدة يجب أن تكون بين ${min} و${max} ثانية`);
  if (errs.length) throw kasFail("بيانات غير صالحة", errs);
  return { ...d, title };
}

const KAS_DEFAULTS = { title: "", description: "", story: "", genre: "adventure", age_group: "6-8",
  duration_sec: 60, style: "soft3d", aspect_ratio: "16:9" };

const kasNow = () => new Date().toISOString().slice(0, 19) + "+00:00";
const kasClone = (o) => JSON.parse(JSON.stringify(o));
const kasFolder = (id) => "project-" + String(id).padStart(4, "0");

function kasValidateAnalysis(a) {
  const ok = a && typeof a === "object" && !Array.isArray(a) && Array.isArray(a.characters) && Array.isArray(a.scenes);
  if (!ok) throw kasFail("بيانات غير صالحة", [{ field: "analysis", message: "التحليل يجب أن يحتوي characters وscenes" }]);
  if (a.scenes.length > 500 || !a.scenes.every((s) => s && typeof s === "object"))
    throw kasFail("بيانات غير صالحة", [{ field: "analysis", message: "بيانات المشاهد غير صالحة" }]);
  if (JSON.stringify(a).length > 2000000) throw kasFail("بيانات غير صالحة", [{ field: "analysis", message: "التحليل كبير جدًا" }]);
  return a;
}

function kasFind(db, id) {
  const p = db.projects.find((x) => x.id === id);
  if (!p) throw kasFail("المشروع غير موجود");
  return p;
}

// ---------- واجهة API المحلية ----------
async function localApi(path, opts = {}) {
  const method = (opts.method || "GET").toUpperCase();
  const body = opts.body;
  let m;
  if (path === "/options" && method === "GET") return kasClone(KAS_OPTIONS);
  if (path === "/health" && method === "GET") {
    return { status: "ok", version: "1.0.0-standalone", standalone: true, tools: [
      { id: "ffmpeg", name: "FFmpeg", purpose: "دمج الصوت المسجَّل مع الفيديو (نسخة الخادم فقط). التصدير هنا يتم بـ MediaRecorder بلا صوت", available: false, path: null, version: null },
      { id: "blender", name: "Blender", purpose: "مشاهد وأنيميشن 3D (اختياري لاحقًا؛ المعاينة الحالية داخل المتصفح لا تحتاجه)", available: false, path: null, version: null },
      { id: "piper", name: "Piper TTS", purpose: "أصوات عربية محلية (اختياري؛ يعمل مع نسخة الخادم فقط. المعاينة هنا تستخدم صوت جهازك)", available: false, path: null, version: null },
    ] };
  }
  if (path === "/projects" && method === "GET") {
    const list = kasClone(kasLoad().projects);
    list.sort((a, b) => (a.updated_at < b.updated_at ? 1 : a.updated_at > b.updated_at ? -1 : b.id - a.id));
    return list;
  }
  if (path === "/projects" && method === "POST") {
    const valid = kasValidate({ ...KAS_DEFAULTS, ...pick(body || {}) });
    const db = kasLoad();
    const now = kasNow();
    const p = { id: db.nextId, ...valid, analysis: null, created_at: now, updated_at: now };
    db.nextId += 1;
    db.projects.push(p);
    kasSave(db);
    return kasClone(p);
  }
  // ---------- مكتبة الشخصيات ----------
  if (path === "/characters" && method === "GET") {
    return kasClone(kasLoad().chars).sort((a, b) => (a.updated_at < b.updated_at ? 1 : a.updated_at > b.updated_at ? -1 : b.id - a.id));
  }
  if (path === "/characters" && method === "POST") {
    const name = kasCharName(body && body.name);
    const params = Char3D.validate((body && body.params) || {});
    const db = kasLoad();
    const now = kasNow();
    const c = { id: db.nextCharId, name, params, identity: Char3D.identity(params), created_at: now, updated_at: now };
    db.nextCharId += 1;
    db.chars.push(c);
    kasSave(db);
    return kasClone(c);
  }
  if ((m = path.match(/^\/characters\/(\d+)$/))) {
    const id = Number(m[1]);
    const db = kasLoad();
    const c = db.chars.find((x) => x.id === id);
    if (!c) throw kasFail("الشخصية غير موجودة");
    if (method === "GET") return kasClone(c);
    if (method === "PATCH") {
      const name = body && body.name !== undefined ? kasCharName(body.name) : c.name;
      const params = body && body.params !== undefined ? Char3D.validate(body.params) : c.params;
      const ref = body && body.ref_image !== undefined ? kasRef(body.ref_image) : c.ref_image;
      Object.assign(c, { name, params, identity: Char3D.identity(params), updated_at: kasNow() });
      if (ref) c.ref_image = ref; else delete c.ref_image;
      kasSave(db);
      return kasClone(c);
    }
    if (method === "DELETE") {
      db.chars = db.chars.filter((x) => x.id !== id);
      kasSave(db);
      return null;
    }
  }
  if ((m = path.match(/^\/projects\/(\d+)$/))) {
    const id = Number(m[1]);
    const db = kasLoad();
    if (method === "GET") return kasClone(kasFind(db, id));
    if (method === "PATCH") {
      const p = kasFind(db, id);
      const changes = pick(body || {});
      const merged = {};
      for (const k of KAS_FIELDS) merged[k] = changes[k] != null ? changes[k] : p[k];
      const valid = kasValidate(merged);
      const analysis = body && body.analysis != null ? kasValidateAnalysis(body.analysis) : p.analysis || null;
      Object.assign(p, valid, { analysis, updated_at: kasNow() });
      kasSave(db);
      return kasClone(p);
    }
    if (method === "DELETE") {
      kasFind(db, id);
      db.projects = db.projects.filter((x) => x.id !== id);
      kasSave(db);
      return null;
    }
  }
  throw kasFail("المسار غير موجود");
}

function kasCharName(v) {
  const name = typeof v === "string" ? v.trim() : "";
  if (!name) throw kasFail("بيانات الشخصية غير صالحة", [{ field: "name", message: "الاسم مطلوب" }]);
  if (name.length > 60) throw kasFail("بيانات الشخصية غير صالحة", [{ field: "name", message: "الاسم أطول من 60 حرفًا" }]);
  return name;
}

function pick(o) {
  const r = {};
  for (const k of KAS_FIELDS) if (k in o) r[k] = o[k];
  return r;
}

// ---------- ZIP (بدون ضغط، بدون أي مكتبة) ----------
const KAS_CRC = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();

function kasCrc32(bytes) {
  let c = 0xffffffff;
  for (let i = 0; i < bytes.length; i++) c = KAS_CRC[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}

function kasBuildZip(entries) { // entries: [{name, data: Uint8Array}] — الاسم المنتهي بـ / يعني مجلدًا
  const enc = new TextEncoder();
  const d = new Date();
  const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  const chunks = [], central = [];
  let offset = 0;
  for (const e of entries) {
    const name = enc.encode(e.name), data = e.data, crc = kasCrc32(data);
    const isDir = e.name.endsWith("/");
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint16(8, 0, true); lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true);
    lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    chunks.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true); ch.setUint16(12, dosTime, true);
    ch.setUint16(14, dosDate, true); ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true);
    ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true);
    ch.setUint32(38, isDir ? 0x10 : 0, true); ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + data.length;
  }
  const cdSize = central.reduce((s, c) => s + c.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  const all = [...chunks, ...central, new Uint8Array(end.buffer)];
  const out = new Uint8Array(all.reduce((s, c) => s + c.length, 0));
  let pos = 0;
  for (const c of all) { out.set(c, pos); pos += c.length; }
  return out;
}

function kasProjectZipEntries(p) {
  const enc = new TextEncoder();
  const root = kasFolder(p.id) + "/";
  const info = { ...p };
  delete info.analysis;
  const extra = p.analysis ? [{ name: root + "script/analysis.json", data: enc.encode(JSON.stringify(p.analysis, null, 2)) }] : [];
  return [
    { name: root, data: new Uint8Array(0) },
    ...KAS_SUBDIRS.map((s) => ({ name: root + s + "/", data: new Uint8Array(0) })),
    { name: root + "project.json", data: enc.encode(JSON.stringify(info, null, 2)) },
    { name: root + "story/story.txt", data: enc.encode(p.story) },
    ...extra,
  ];
}

async function downloadProjectZip(id) {
  const p = await localApi(`/projects/${id}`);
  const blob = new Blob([kasBuildZip(kasProjectZipEntries(p))], { type: "application/zip" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = kasFolder(p.id) + ".zip";
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

  const mentionsIn = (reg, tokens) => {
    const out = [];

  };

  // ---------- تحليل النص إلى وحدات ----------
  function parseUnits(text, reg) {
    const paragraphs = text.replace(/\r/g, "").split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean);

    paragraphs.forEach((para, pi) => {
      const quotes = [];
      const lines = para.split("\n").map((l) => l.trim()).filter(Boolean);
      const processed = lines.map((line) => {
        // «س: نص» أو «- نص»

  // جزء = { b: العظمة، c: مركز محلي، r: أنصاف أقطار، col، rot، bias، res، group }
  function part(b, c, r, col, o = {}) {
    return { b, c, r, col, rot: o.rot || null, bias: o.bias || 0, res: o.res || [14, 9], minY: o.minY, group: groupOf(b) };
  }

  function headParts(P, face, blink, C) {
    const L = [];
    const open = Math.max(0.06, face.eo * blink);
    L.push(part("head", HC, HR, C.head, { res: [18, 12] }));
    for (const sx of [1, -1]) {
      const ec = headSurf(0.105 * sx, 0.045, 0.002);
      L.push(part("head", ec, [0.05, 0.062 * open, 0.03], FIXED.white, { bias: 0.05, res: [12, 8] }));
      const px = ec[0] + face.px * 0.016 * sx * -1 * -1, py = ec[1] + face.py * 0.016 * open;
      L.push(part("head", [px, py, ec[2] + 0.018], [0.032, 0.043 * open, 0.016], C.eyes, { bias: 0.07, res: [10, 7] }));
      L.push(part("head", [px, py, ec[2] + 0.03], [0.016, 0.024 * open, 0.01], FIXED.dark, { bias: 0.09, res: [8, 6] }));
      if (open > 0.3) L.push(part("head", [px - 0.011 * sx, py + 0.017 * open, ec[2] + 0.04], [0.008, 0.009, 0.006], FIXED.white, { bias: 0.11, res: [6, 4] }));
    }
    // تفاصيل بشرية: أذنان، أنف، حاجبان، خدّان (ألوان مشتقة من لون البشرة والشعر)
    const mix = (hex, to, f) => { const a = rgbOf(hex), b = rgbOf(to); return "#" + a.map((v, i) => Math.round(v + (b[i] - v) * f).toString(16).padStart(2, "0")).join(""); };
    const ear = mix(C.head, "#d9826b", 0.25), nose = mix(C.head, "#ffffff", 0.12);
    for (const sx of [1, -1]) {
      L.push(part("head", [0.245 * sx, HC[1] - 0.005, HC[2] - 0.01], [0.04, 0.065, 0.03], ear, { res: [8, 6] }));
      L.push(part("head", headSurf(0.105 * sx, 0.135, 0.004), [0.062, 0.013, 0.014], C.hair || FIXED.dark, { bias: 0.06, res: [8, 5] }));
      L.push(part("head", headSurf(0.165 * sx, -0.07, 0.004), [0.045, 0.03, 0.012], mix(C.head, "#ff8a9a", 0.35), { bias: 0.03, res: [8, 6] }));
    }
    L.push(part("head", headSurf(0, -0.03, 0.022), [0.032, 0.04, 0.034], nose, { bias: 0.045, res: [10, 7] }));
    return L;
  }

  // ---------- البشر ----------
  function buildHuman(P, face, blink, C) {
    const L = [], cl = P.outfit, shirtLike = cl.top === "shirt" || cl.top === "tshirt" || cl.top === "robe";
    const topCol = cl.top === "none" ? C.skin : C.top;
    const botCol = cl.bottom === "none" ? C.skin : C.bottom;
    // الجذع
    L.push(part("hips", [0, 0.02, 0], [0.15, 0.12, 0.13], cl.bottom === "shorts" || cl.bottom === "pants" || cl.bottom === "skirt" || cl.bottom === "dress" ? botCol : C.skin, { res: [12, 8] }));
    L.push(part("spine", [0, 0.03, 0], [0.16, 0.15, 0.14], topCol, { res: [12, 8] }));
    L.push(part("chest", [0, 0.02, 0], [0.145, 0.13, 0.125], topCol, { res: [12, 8] }));
    if (cl.top === "robe") L.push(part("spine", [0, -0.1, 0], [0.19, 0.28, 0.17], C.top, { res: [12, 8], bias: 0.01 }));
    if (cl.top === "none" && P.gender === "female" && P.age !== "child") L.push(part("chest", [0, 0.02, 0.05], [0.08, 0.07, 0.07], C.skin, { res: [8, 6], bias: 0.02 }));
    if (cl.bottom === "skirt" || cl.bottom === "dress") L.push(part("hips", [0, -0.16, 0], [0.21, 0.2, 0.2], C.bottom, { res: [12, 8], bias: 0.01 }));
    L.push(part("neck", [0, 0.03, 0], [0.085, 0.075, 0.085], C.skin, { res: [8, 6] }));
    // الرأس والوجه
    L.push(...headParts(P, face, blink, { head: C.skin, eyes: C.eyes, hair: C.hair }));
    // الشعر
    const H = C.hair;
    if (P.hair === "short" || P.hair === "long" || P.hair === "bun") L.push(part("head", [0, HC[1] + 0.05, HC[2] - 0.01], [0.262, 0.2, 0.245], H, { res: [14, 9], bias: 0, minY: 0.18 }));
    if (P.hair === "long") L.push(part("head", [0, HC[1] - 0.08, HC[2] - 0.12], [0.25, 0.3, 0.12], H, { res: [12, 9] }));
    if (P.hair === "bun") L.push(part("head", [0, HC[1] + 0.27, HC[2] - 0.03], [0.1, 0.1, 0.1], H, { res: [8, 6] }));
    if (P.hair === "curly") for (let i = 0; i < 8; i++) { const a = (i / 8) * 2 * PI; L.push(part("head", [cos(a) * 0.18, HC[1] + 0.2, HC[2] + sin(a) * 0.1], [0.085, 0.085, 0.085], H, { res: [8, 6] })); }
    if (P.beard === "full") L.push(part("head", [0, HC[1] - 0.13, HC[2] + 0.06], [0.13, 0.09, 0.09], H, { res: [10, 7], bias: 0.03 }));
    if (P.beard === "stubble") L.push(part("head", [0, HC[1] - 0.12, HC[2] + 0.07], [0.12, 0.06, 0.07], H, { res: [10, 7], bias: 0.03 }));
    // الأذرع والأرجل
    for (const s of ["L", "R"]) {
      if (cl.top === "tshirt" || cl.top === "shirt" || cl.top === "robe") L.push(part("shoulder" + s, [0, -0.09, 0], [0.065, 0.11, 0.065], topCol, { res: [10, 7] }));
      else L.push(part("shoulder" + s, [0, -0.09, 0], [0.055, 0.115, 0.055], C.skin, { res: [10, 7] }));
      L.push(part("elbow" + s, [0, -0.08, 0], [0.05, 0.1, 0.05], shirtLike && cl.top === "shirt" ? topCol : C.skin, { res: [10, 7] }));
      L.push(part("hand" + s, [0, -0.03, 0], [0.065, 0.065, 0.065], C.skin, { res: [10, 7] }));
      L.push(part("thigh" + s, [0, -0.1, 0], [0.085, 0.13, 0.085], cl.bottom === "pants" || cl.bottom === "shorts" ? botCol : C.skin, { res: [12, 8] }));
      L.push(part("shin" + s, [0, -0.07, 0], [0.065, 0.1, 0.065], cl.bottom === "pants" ? botCol : C.skin, { res: [10, 7] }));
      L.push(part("foot" + s, [0, -0.03, 0.07], [0.07, 0.045, 0.13], C.shoes, { res: [12, 8] }));
    }
    return L;
  }

  // ---------- الحيوانات والخياليات ----------
  function buildRabbit(P, face, blink, C) {
    const L = [];
    L.push(part("hips", [0, 0.02, 0], [0.15, 0.12, 0.13], C.fur, { res: [12, 8] }));

    L.push(part("neck", [0, 0.03, 0], [0.085, 0.075, 0.085], C.fur, { res: [8, 6] }));
    L.push(...headParts(P, face, blink, { head: C.fur, eyes: C.eyes }));
    L.push(part("head", headSurf(0, -0.04), [0.032, 0.024, 0.026], C.nose, { bias: 0.08, res: [10, 7] }));
    for (const s of ["L", "R"]) {
      L.push(part("ear" + s, [0, 0.1, 0], [0.065, 0.14, 0.04], C.fur, { res: [10, 8] }));
      L.push(part("ear" + s, [0, 0.1, 0.022], [0.035, 0.105, 0.014], C.inner_ear, { res: [8, 6], bias: 0.01 }));
      L.push(part("ear" + s + "2", [0, 0.1, 0], [0.06, 0.13, 0.036], C.fur, { res: [10, 8] }));
      L.push(part("ear" + s + "2", [0, 0.09, 0.02], [0.03, 0.09, 0.012], C.inner_ear, { res: [8, 6], bias: 0.01 }));
      L.push(part("shoulder" + s, [0, -0.09, 0], [0.055, 0.115, 0.055], C.fur, { res: [10, 7] }));
      L.push(part("elbow" + s, [0, -0.08, 0], [0.05, 0.1, 0.05], C.fur, { res: [10, 7] }));

    }
    L.push(part("tail", [0, 0.02, -0.04], [0.075, 0.075, 0.075], C.belly, { res: [10, 7] }));
    return L;
  }

  function buildTurtle(P, face, blink, C) {
    const L = [];
    L.push(part("spine", [0, 0.1, -0.02], [0.26, 0.2, 0.3], C.shell, { res: [14, 9], bias: 0.01 }));
    L.push(part("spine", [0, -0.06, 0.04], [0.22, 0.06, 0.24], C.belly, { res: [12, 6] }));

    L.push(...headParts(P, face, blink, { head: C.fur, eyes: C.eyes }));
    for (const s of ["L", "R"]) {
      L.push(part("shoulder" + s, [0, -0.06, 0], [0.06, 0.07, 0.06], C.fur, { res: [8, 6] }));
      L.push(part("hand" + s, [0, -0.03, 0.02], [0.065, 0.05, 0.07], C.fur, { res: [8, 6] }));
      L.push(part("thigh" + s, [0, -0.06, 0], [0.075, 0.08, 0.075], C.fur, { res: [8, 6] }));
      L.push(part("foot" + s, [0, -0.02, 0.04], [0.07, 0.04, 0.08], C.fur, { res: [8, 6] }));

    L.push(part("tail", [0, 0.0, -0.03], [0.04, 0.03, 0.06], C.fur, { res: [6, 4] }));

  function buildDragon(P, face, blink, C) {
    const L = [];
    L.push(part("hips", [0, 0.02, 0], [0.19, 0.15, 0.2], C.fur, { res: [12, 8] }));
    L.push(part("spine", [0, 0.03, 0], [0.2, 0.17, 0.2], C.fur, { res: [12, 8] }));

    L.push(part("neck", [0, 0.03, 0], [0.1, 0.09, 0.1], C.fur, { res: [8, 6] }));
    L.push(...headParts(P, face, blink, { head: C.fur, eyes: C.eyes }));
    L.push(part("head", headSurf(0, -0.03, 0.05), [0.1, 0.07, 0.1], C.fur, { res: [8, 6], bias: 0.03 }));

    for (const sx of [1, -1]) L.push(part("chest", [0.28 * sx, 0.12, -0.02], [0.02, 0.26, 0.2], C.wing, { res: [8, 6], rot: [0, 0, 0.5 * sx] }));
    for (const s of ["L", "R"]) {
      L.push(part("shoulder" + s, [0, -0.08, 0], [0.06, 0.12, 0.06], C.fur, { res: [8, 6] }));
      L.push(part("hand" + s, [0, -0.03, 0.02], [0.06, 0.05, 0.07], C.fur, { res: [8, 6] }));
      L.push(part("thigh" + s, [0, -0.1, 0], [0.09, 0.13, 0.09], C.fur, { res: [10, 7] }));

      L.push(part("foot" + s, [0, -0.03, 0.05], [0.08, 0.05, 0.11], C.shoes, { res: [8, 6] }));
    }
    L.push(part("tail", [0, 0.0, -0.1], [0.08, 0.07, 0.12], C.fur, { res: [8, 6] }));

  // ---------- إكسسوارات (تُضاف فوق أي نوع) ----------
  function accessoryParts(P, C) {
    const L = [], A = P.accessories;
    if (A.includes("hat")) {
      L.push(part("head", [0, HC[1] + 0.2, HC[2] - 0.01], [0.3, 0.03, 0.3], C.accent, { res: [12, 6], bias: 0.02 }));
      L.push(part("head", [0, HC[1] + 0.34, HC[2] - 0.01], [0.18, 0.2, 0.18], C.accent, { res: [10, 7], bias: 0.02 }));
    }
    if (A.includes("crown")) for (let i = 0; i < 6; i++) { const a = (i / 6) * 2 * PI; L.push(part("head", [cos(a) * 0.19, HC[1] + 0.22, HC[2] + sin(a) * 0.19], [0.035, 0.05, 0.035], C.accent, { res: [6, 4], bias: 0.04 })); }
    if (A.includes("cape")) L.push(part("chest", [0, -0.1, -0.14], [0.2, 0.28, 0.03], C.accent, { res: [10, 7], bias: -0.02 }));
    if (A.includes("bow")) {
      L.push(part("neck", [0, -0.015, 0.075], [0.03, 0.03, 0.025], C.accent, { bias: 0.04, res: [8, 6] }));
      L.push(part("neck", [0.06, -0.015, 0.07], [0.055, 0.032, 0.02], C.accent, { bias: 0.035, rot: [0, 0, 0.25], res: [8, 6] }));
      L.push(part("neck", [-0.06, -0.015, 0.07], [0.055, 0.032, 0.02], C.accent, { bias: 0.035, rot: [0, 0, -0.25], res: [8, 6] }));
    }
    return L;
  }

  function buildParts(P, face, blink, prop, holds = []) {
    const C = {};
    for (const k of COLOR_KEYS) C[k] = P.colors[k];
    let L;
    if (P.archetype === "human") L = buildHuman(P, face, blink, C);
    else if (P.species === "turtle") L = buildTurtle(P, face, blink, C);
    else if (P.species === "dragon") L = buildDragon(P, face, blink, C);
    else L = buildRabbit(P, face, blink, C); // الأرنب والشكل العام للحيوانات
    for (const h of holds) if (h === "carrot") { // جزرة في اليد اليمنى
      L.push(part("handR", [0, -0.1, 0.02], [0.028, 0.1, 0.028], "#ff7a1a", { res: [8, 6], rot: [0.3, 0, 0] }));
      L.push(part("handR", [0, -0.2, 0.04], [0.02, 0.04, 0.02], "#3f9e4d", { res: [6, 4], rot: [0.3, 0, 0] }));
    }
    return [...L, ...accessoryParts(P, C)];
  }

  // زخارف مسطحة على الوجه: حواجب وفم وأسنان وتجاعيد ونظارة
  function faceDecals(face, blink, extras = {}) {
    const D = [];
    const poly = (pts, color, bias) => D.push({ pts, color, bias });
    const line = (a, b, wdt, color, bias) => {
      const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1, nx = (-dy / len) * wdt / 2, ny = (dx / len) * wdt / 2;
      poly([headSurf(a[0] + nx, a[1] + ny, 0.03), headSurf(b[0] + nx, b[1] + ny, 0.03), headSurf(b[0] - nx, b[1] - ny, 0.03), headSurf(a[0] - nx, a[1] - ny, 0.03)], color, bias);
    };
    for (const [sx, by, ang] of [[1, face.bly, face.bla], [-1, face.bry, face.bra]]) {
      const y0 = 0.045 + 0.1 + by, a = [0.105 * sx - 0.048 * sx, y0 - ang * 0.032], b = [0.105 * sx + 0.048 * sx, y0 + ang * 0.032];
      const m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2 + 0.006];
      line(a, m, 0.016, FIXED.dark, 0.14); line(m, b, 0.016, FIXED.dark, 0.14);
    }
    const w = face.mw, my = -0.108, n = 8, up = [], lo = [];
    for (let i = 0; i <= n; i++) {
      const t = (i / n) * 2 - 1, x = t * w, yu = my + face.mk * t * t;
      up.push([x, yu]); lo.push([x, yu - face.mo * 0.085 * (1 - t * t)]);
    }
    if (face.mo > 0.12) {
      poly([...up, ...lo.slice().reverse()].map((p) => headSurf(p[0], p[1], 0.032)), FIXED.mouth, 0.15);
      if (face.mo > 0.25) {
        const lowest = Math.min(...lo.map((p) => p[1])), tg = [];
        for (let i = 0; i < 10; i++) { const a = (i / 10) * 2 * PI; tg.push(headSurf(cos(a) * w * 0.45, lowest + 0.014 + sin(a) * face.mo * 0.022, 0.034)); }
        poly(tg, FIXED.tongue, 0.16);
      }
    } else {
      for (let i = 0; i < n; i++) line(up[i], up[i + 1], 0.008, FIXED.dark, 0.15);
    }
    // أسنان أمامية بارزة للأرنب فقط. غيره يُظهر أسنانه عند فتحة صغيرة (ابتسامة، حرف «ف») لا والفم مغلق.
    if (extras.buckTeeth ? face.mo < 0.25 : face.mo >= 0.12 && face.mo < 0.3) for (const sx of [-1, 1]) {
      const cx = 0.012 * sx, top = my - 0.002, h = 0.026, q = [];
      for (const [dx, dy] of [[-0.0105, 0], [0.0105, 0], [0.0105, -h], [-0.0105, -h]]) q.push(headSurf(cx + dx, top + dy, 0.034));
      poly(q, FIXED.tooth, 0.17);
    }
    if (extras.wrinkles) for (const yy of [0.2, 0.225]) line([-0.07, yy], [0.07, yy], 0.008, FIXED.dark, 0.13);
    if (extras.glasses) {
      for (const sx of [1, -1]) {
        const cx = 0.105 * sx, cy = 0.045, hw = 0.058, hh = 0.07, g = 0.12;
        line([cx - hw, cy + hh], [cx + hw, cy + hh], 0.014, FIXED.dark, g);
        line([cx - hw, cy - hh], [cx + hw, cy - hh], 0.014, FIXED.dark, g);
        line([cx - hw, cy - hh], [cx - hw, cy + hh], 0.014, FIXED.dark, g);
        line([cx + hw, cy - hh], [cx + hw, cy + hh], 0.014, FIXED.dark, g);
      }
      line([-0.047, 0.045], [0.047, 0.045], 0.012, FIXED.dark, 0.12);
    }
    return D;
  }

  // ---------- الكاميرا والرسم ----------
  const BANDS = [0.62, 0.8, 1.0];
  // cam: { yaw, pitch, dist, ty, tx } — الهدف نقطة (tx, ty, 0). state: { clip|pose, time, face, blink, at:[x,z], yaw, env }
  function camSetup(cam, w, h) {
    const yaw = cam.yaw || 0, pitch = cam.pitch === undefined ? 0.08 : cam.pitch, dist = cam.dist || 3.9;
    const tx = cam.tx || 0, ty = cam.ty === undefined ? 0.8 : cam.ty;
    const cp = [tx + sin(yaw) * cos(pitch) * dist, ty + sin(pitch) * dist, cos(yaw) * cos(pitch) * dist];
    const f = norm3([tx - cp[0], ty - cp[1], -cp[2]]), r = norm3(cross(f, [0, 1, 0])), u = cross(r, f);
    const focal = (h / 2) / Math.tan((34 * PI) / 360);
    const proj = (p) => { const d = [p[0] - cp[0], p[1] - cp[1], p[2] - cp[2]], z = dot(d, f); return [w / 2 + (dot(d, r) / z) * focal, h / 2 - (dot(d, u) / z) * focal, z]; };
    const Lw = norm3([-0.4 * r[0] + 0.75 * u[0] - 0.55 * f[0], -0.4 * r[1] + 0.75 * u[1] - 0.55 * f[1], -0.4 * r[2] + 0.75 * u[2] - 0.55 * f[2]]);
    // q: مضاعف دقة تقسيم المجسّمات. شخصية واحدة قريبة تحتاج دقة أعلى من مشهد مزدحم.
    return { cp, proj, Lw, q: cam.quality || 1.8 };
  }

  // يجمع أوجه شخصية واحدة بعد وضعها في المشهد (المكان والدوران) دون رسم
  function collect(P, state, CS) {
    const prop = proportions(P);
    const pose = state.pose || evalClip(state.clip || "idle", state.time || 0);
    const bones = { ...(pose.bones || {}) };

      frame(t) {
        const tt = Math.min(start, Math.max(0, t));
        let p = parts[0];
        for (const x of parts) if (tt >= x.start) p = x;
        const f = p.play.frame(tt - p.start);
        return { ...f, sceneId: p.scene.id };
      },
    };
  }

  // البيئة: أسماء الأماكن المائية تعطي مشهد البحر، والباقي مرج
  const envFor = (scene) => (/بحر|شاطئ|نهر|بحيرة|ماء/.test(scene.location || "") ? "sea" : "meadow");

  return { envFor, ACTION_CLIP, CAM_MOVES, CATEGORY_LABELS, catalog, blendPoses, clipPose, buildTimeline, sampleSegments, layout, shotCam, buildCamera, makeEnv, buildScene, buildFilm, CROSSFADE, shotSpans };
})();


"use strict";
// الأصوات ومزامنة الشفاه (المرحلة 5).
// - الصوت: واجهة الكلام في المتصفح (Web Speech). تعتمد على الأصوات العربية الموجودة في هاتفك، فلا تنزيل ولا مفتاح مدفوع.
//   الكلام لا يمكن تسجيله إلى ملف من المتصفح، لذلك تصدير الصوت داخل الفيديو يحتاج Piper (المرحلة 7).
// - مزامنة الشفاه: حروف الكلام العربي تُحوَّل إلى أشكال فم (visemes) تُمرَّر على مدة الجملة.
//   مع الصوت تتبع الشفاه تقدّم النطق الفعلي (أحداث boundary إن وُجدت)، وبدونه تتبع جدولًا زمنيًا تقديريًا.
const VoiceLib = (() => {
  // ---------- أشكال الفم ----------
  // mo: فتحة الفم، mw: عرضه (نفس مقاييس وجه Char3D)
  const SHAPES = {
    aa: { mo: 0.65, mw: 0.07 },   // ا ع ح ه: فم مفتوح
    oo: { mo: 0.34, mw: 0.028 },  // و وضمّة: فم مضموم مدوّر
    ee: { mo: 0.22, mw: 0.085 },  // ي كسرة: فم مفرود
    mm: { mo: 0.0, mw: 0.05 },    // ب م: إطباق الشفتين
    ff: { mo: 0.1, mw: 0.055 },   // ف: الأسنان على الشفة
    cs: { mo: 0.16, mw: 0.05 },   // باقي الحروف: فتحة صغيرة
    rest: { mo: 0.0, mw: 0.05 },  // سكون
  };
  const CLASS = {};
  const assign = (chars, v) => { for (const c of chars) CLASS[c] = v; };
  assign("اأإآعحهءى", "aa");
  assign("وؤ", "oo");
  assign("يئ", "ee");
  assign("بم", "mm");
  assign("ف", "ff");
  const VOWEL_W = 1.4, CONS_W = 0.8, SPACE_W = 0.7, PAUSE_W = 1.8;

  // نص عربي ← تسلسل أشكال فم موزونة. التشكيل يُهمل ما عدا الضمة والكسرة لتمييز الحرف التالي.
  function toVisemes(text) {
    const out = [];
    const push = (v, w) => { const last = out[out.length - 1]; if (last && last.v === v && v !== "rest") last.w += w * 0.5; else out.push({ v, w }); };
    for (const ch of String(text || "")) {
      if (/[\s]/.test(ch)) push("rest", SPACE_W);
      else if (/[.!؟?،,;:…]/.test(ch)) push("rest", PAUSE_W);
      else if (ch === "ُ") push("oo", 0.5);      // ضمة
      else if (ch === "ِ") push("ee", 0.5);      // كسرة
      else if (ch === "َ") push("aa", 0.5);      // فتحة
      else if (/[ً-ْٰـ]/.test(ch)) continue; // باقي التشكيل والتطويل
      else if (/\p{L}/u.test(ch)) { const v = CLASS[ch] || "cs"; push(v, v === "cs" || v === "mm" || v === "ff" ? CONS_W : VOWEL_W); }
    }
    return out;
  }

  const smooth = (x) => x * x * (3 - 2 * x);
  // شكل الفم عند تقدّم frac من 0 إلى 1 داخل الجملة. خارج [0,1] يعود الفم مغلقًا.
  function lipAt(vis, frac) {
    if (!vis || !vis.length || frac < 0 || frac > 1) return { ...SHAPES.rest };
    const total = vis.reduce((s, x) => s + x.w, 0);
    let pos = frac * total, i = 0;
    while (i < vis.length - 1 && pos > vis[i].w) { pos -= vis[i].w; i++; }
    const cur = SHAPES[vis[i].v], nxt = SHAPES[(vis[i + 1] || { v: "rest" }).v];
    const k = smooth(Math.min(1, Math.max(0, (pos / vis[i].w - 0.55) / 0.45))); // ننتقل للشكل التالي في آخر الحرف
    return { mo: cur.mo + (nxt.mo - cur.mo) * k, mw: cur.mw + (nxt.mw - cur.mw) * k };
  }

  // ---------- المدة التقديرية ----------
  // الكلام العربي الطبيعي نحو 12 حرفًا في الثانية عند السرعة 1، مع وقفات عند علامات الترقيم
  function estimateDuration(text, rate = 1) {
    const s = String(text || "");
    const letters = (s.match(/\p{L}/gu) || []).length;
    const soft = (s.match(/[،,;:]/g) || []).length * 0.3, hard = (s.match(/[.!؟?…]/g) || []).length * 0.45;
    return Math.max(0.7, letters / 12 / Math.max(0.3, rate) + soft + hard);
  }

  // ---------- جدول الحوار ----------
  // يرتّب حوار المشهد بالتتابع. إن زاد على مدة المشهد يُضغط الجدول للعرض الصامت ويُرفع تنبيه.
  function planScene(scene, rateOf = () => 1) {
    const total = Math.max(1, Number(scene.duration_sec) || 1), lead = 0.5, gap = 0.35;
    const raw = (scene.dialogue || []).filter((d) => d && String(d.text || "").trim()).map((d, i) => {
      const dur = estimateDuration(d.text, rateOf(d.speaker));
      return { key: `${scene.id || "s"}#${i}`, speaker: d.speaker || "narrator", text: String(d.text).trim(), emotion: d.emotion || "neutral", dur, visemes: toVisemes(d.text) };
    });
    let t = lead;
    for (const l of raw) { l.start = t; t += l.dur + gap; }
    const need = raw.length ? t - gap + 0.3 : 0;
    const overflow = need > total;
    if (overflow) { const f = (total - lead - 0.3) / (need - lead - 0.3); for (const l of raw) { l.start = lead + (l.start - lead) * f; l.dur *= f; } }
    return { lines: raw, overflow, needSeconds: Math.ceil(need) };
  }

  // ---------- ملف الصوت لكل شخصية ----------
  const BASE = {
    "human:male:adult": { pitch: 0.8, rate: 0.95 }, "human:female:adult": { pitch: 1.15, rate: 1.0 },
    "human:male:child": { pitch: 1.55, rate: 1.05 }, "human:female:child": { pitch: 1.65, rate: 1.05 }, "human:neutral:child": { pitch: 1.6, rate: 1.05 },
    "human:male:teen": { pitch: 1.1, rate: 1.0 }, "human:female:teen": { pitch: 1.35, rate: 1.0 },
    "human:male:senior": { pitch: 0.65, rate: 0.82 }, "human:female:senior": { pitch: 0.9, rate: 0.85 },
  };
  function defaultProfile(c) {
    if (!c) return { pitch: 1, rate: 0.95 };   // الراوي
    if (c.archetype === "animal") return { pitch: 1.5, rate: 1.05 };
    if (c.archetype === "creature") return { pitch: 0.55, rate: 0.85 };
    return { ...(BASE[`human:${c.gender}:${c.age}`] || BASE[`human:${c.gender === "female" ? "female" : "male"}:adult`] || { pitch: 1, rate: 1 }) };
  }
  // ما يختاره المستخدم (c.voice) يغلب الافتراضي
  function profileFor(c) {
    const d = defaultProfile(c), v = (c && c.voice) || {};
    const num = (x, def, lo, hi) => (Number.isFinite(Number(x)) && x !== "" && x !== null && x !== undefined ? Math.min(hi, Math.max(lo, Number(x))) : def);
    return { name: v.name || "", pitch: num(v.pitch, d.pitch, 0.3, 2), rate: num(v.rate, d.rate, 0.4, 1.8) };
  }

  // الأصوات العربية فقط (ar, ar-SA, ar-EG…)
  const arabicVoices = (voices) => (voices || []).filter((v) => /^ar\b|^ar[-_]/i.test(v.lang || ""));
  // صوت لكل شخصية: المختار بالاسم، وإلا نوزّع الأصوات المتاحة على الشخصيات بالتناوب
  function pickVoice(profile, index, voices) {
    const ar = arabicVoices(voices);
    if (!ar.length) return null;
    return ar.find((v) => v.name === profile.name) || ar[index % ar.length];
  }

  // ---------- المتكلّم ----------
  // synth/Utter قابلان للحقن للاختبار. الأحداث الحقيقية (بداية/نهاية/حدود الكلمات) هي مصدر المزامنة مع الصوت.
  function createSpeaker({ synth, Utter, now = () => Date.now() }) {
    const active = new Map();   // key -> { t0, idx, len, done }
    const available = !!(synth && Utter);
    function speak(line, profile, voice, onEnd) {
      if (!available) return false;
      const u = new Utter(line.text);
      u.lang = (voice && voice.lang) || "ar";
      if (voice) u.voice = voice;
      u.pitch = profile.pitch; u.rate = profile.rate;
      const st = { t0: null, idx: 0, len: line.text.length, done: false, est: line.dur };
      active.set(line.key, st);
      u.onstart = () => { st.t0 = now(); };
      u.onboundary = (e) => { if (e && Number.isFinite(e.charIndex)) { st.idx = e.charIndex; st.hasBoundary = true; } };
      u.onend = u.onerror = () => { st.done = true; if (onEnd) onEnd(line); };
      synth.speak(u);
      return true;
    }
    // تقدّم النطق 0..1، أو null إن لم يبدأ/انتهى
    function progress(key) {
      const st = active.get(key);
      if (!st || st.done || st.t0 === null) return null;
      if (st.hasBoundary) return Math.min(1, (st.idx + 2) / st.len);
      return Math.min(1, (now() - st.t0) / 1000 / Math.max(0.3, st.est));
    }
    function cancel() { if (available) synth.cancel(); for (const st of active.values()) st.done = true; active.clear(); }
    return { speak, progress, cancel, available };
  }

  return { SHAPES, toVisemes, lipAt, estimateDuration, planScene, defaultProfile, profileFor, arabicVoices, pickVoice, createSpeaker };
})();


"use strict";
// واجهة تحليل القصة وتعديل نتائجها (المرحلة 2).
// تعتمد على el / api / toast / confirmDialog من app.js وعلى StoryAnalyzer. كل تعديل يُحفظ تلقائيًا.
function renderAnalysisPanel(project, form) {
  const SA = StoryAnalyzer;
  let A = project.analysis || null;
  let LIB = []; // مكتبة الشخصيات (لربط كل شخصية بسجلها وقفل هويتها)
  api("/characters").then((l) => { LIB = l; render(); }).catch(() => {});
  const openScenes = new Set();
  let saveTimer = null;

  const box = el("div", { class: "card", id: "analysis-box" });
  const statusEl = el("span", { class: "hint", role: "status" });
  const staleEl = el("div", { class: "hint warn", hidden: true }, "القصة تغيّرت منذ آخر تحليل. أعد التحليل لتطبيق التغيير.");
  const statsEl = el("div", { class: "hint" });

  const setStatus = (t, bad) => { statusEl.textContent = t; statusEl.style.color = bad ? "var(--danger)" : ""; };
  function scheduleSave() {
    setStatus("جارٍ الحفظ…");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      try { await api(`/projects/${project.id}`, { method: "PATCH", body: { analysis: A } }); setStatus("تم الحفظ تلقائيًا ✓"); }
      catch (e) { setStatus("تعذّر الحفظ: " + e.message, true); }
    }, 400);
  }
  const changed = () => { updateStats(); scheduleSave(); };

  // ---------- عناصر صغيرة ----------
  const sel = (map, value, onChange, label) => el("select", { "aria-label": label, onchange: (e) => onChange(e.target.value) },
    Object.entries(map).map(([k, v]) => el("option", { value: k, selected: k === value }, v)));
  const inp = (value, onChange, attrs = {}) => el("input", { value: value ?? "", ...attrs, onchange: (e) => onChange(e.target.value) });
  const area = (value, onChange, attrs = {}) => el("textarea", { ...attrs, onchange: (e) => onChange(e.target.value) }, value ?? "");
  const btn = (text, onclick, cls = "") => el("button", { type: "button", class: "sm " + cls, onclick }, text);
  const field = (label, node) => el("div", { class: "field" }, el("label", {}, label), node);

  const nameMap = () => Object.fromEntries(A.characters.map((c) => [c.id, c.name]));
  const speakerMap = () => ({ narrator: "الراوي", ...nameMap() });
  const subjectMap = () => ({ "": "— الكل / غير محدد —", ...nameMap() });
  const actionMap = Object.fromEntries(SA.ACTIONS.map((a) => [a.id, a.label]));
  const exprMap = Object.fromEntries(SA.EXPRESSIONS.map((x) => [x.id, x.label]));
  const nextId = (prefix, list) => prefix + (Math.max(0, ...list.map((x) => Number(String(x.id).slice(prefix.length)) || 0)) + 1);

  function updateStats() {
    if (!A) { statsEl.textContent = ""; return; }
    const total = A.scenes.reduce((s, x) => s + (Number(x.duration_sec) || 0), 0);
    const want = Number(form.elements.duration_sec.value);
    const diff = Number.isFinite(want) && total !== want;
    statsEl.textContent = `${A.scenes.length} مشاهد · ${A.characters.length} شخصيات · مجموع المدد ${total} ث` +
      (diff ? ` (مدة الفيلم في الإعدادات ${want} ث)` : "");
    statsEl.style.color = diff ? "var(--warn)" : "";
  }

  function checkStale() {
    if (!A) { staleEl.hidden = true; return; }
    staleEl.hidden = SA.hash(form.elements.story.value.trim()) === A.story_hash;
  }
  form.elements.story.addEventListener("input", checkStale);
  form.elements.duration_sec.addEventListener("input", updateStats);

  // ---------- التحليل ----------
  async function doAnalyze() {
    const story = form.elements.story.value;
    const dur = Number(form.elements.duration_sec.value);
    try {
      const result = SA.analyze(story, { duration_sec: dur });
      // أصوات الشخصيات التي ضبطها المستخدم تبقى عند إعادة التحليل (بالاسم)
      if (A) for (const c of result.characters) { const old = A.characters.find((x) => x.name === c.name && x.voice); if (old) c.voice = old.voice; }
      // الشخصيات تُنشأ في المكتبة تلقائيًا مع التحليل، ثم تُربط بسجلاتها
      let created = [];
      try { created = await saveStoryCharactersToLibrary(project, result); LIB = await api("/characters"); } catch (e) { created = []; }
      await api(`/projects/${project.id}`, { method: "PATCH", body: { story, duration_sec: dur, analysis: result } });
      A = result;
      openScenes.clear();
      render();
      const counts = `${result.scenes.length} مشاهد و${result.characters.length} شخصيات`;
      toast(`تم تحليل القصة: ${counts}` + (created.length ? `. أُضيفت للمكتبة: ${created.join("، ")}` : ""));
      // اللوحة تقع أسفل نموذج طويل على الهاتف: ننتقل إليها حتى يرى المستخدم المشاهد
      box.scrollIntoView({ behavior: "smooth", block: "start" });
    } catch (e) {
      const d = (e.details && e.details[0]) ? ` (${e.details[0].message})` : "";
      toast(e.message + d, true);
    }
  }
  function startAnalyze() {
    if (!A) { doAnalyze(); return; }
    confirmDialog("إعادة تحليل القصة؟", "سيُستبدل التحليل الحالي وتضيع كل تعديلاتك عليه.", doAnalyze, "نعم، أعد التحليل");
  }

  // ---------- الشخصيات ----------
  function removeChar(id) {
    A.characters = A.characters.filter((c) => c.id !== id);
    for (const s of A.scenes) {
      s.characters = s.characters.filter((x) => x !== id);
      s.dialogue.forEach((d) => { if (d.speaker === id) d.speaker = "narrator"; });
      s.actions.forEach((a) => { if (a.character === id) a.character = ""; });
      s.expressions = s.expressions.filter((x) => x.character !== id);
      s.shots.forEach((h) => { if (h.subject === id) h.subject = ""; });
    }
  }
  // حالة قفل الهوية: مربوطة بالمكتبة؟ هل تغيّر شكلها منذ الربط؟
  function lockOf(c) {
    if (!c.library_id) return { text: "غير مربوطة بالمكتبة", cls: "meta" };
    const lib = LIB.find((x) => x.id === c.library_id);
    if (!lib) return { text: "⚠ الشخصية حُذفت من المكتبة", cls: "warn" };
    if (lib.identity !== c.identity) return { text: "⚠ تغيّر شكلها في المكتبة منذ الربط", cls: "warn", fix: () => { c.identity = lib.identity; changed(); render(); } };
    return { text: "✓ هويتها مقفلة (" + lib.identity + ")", cls: "ok" };
  }
  function charsCard() {
    const libOpts = [["", "— بدون ربط —"], ...LIB.map((x) => [String(x.id), x.name])];
    return el("div", { class: "sub" },
      el("h3", {}, "الشخصيات"),
      el("p", { class: "hint" }, "الشخصيات مستخرجة من القصة. اربط كل واحدة بشخصية من المكتبة ليبقى شكلها ثابتًا في كل المشاهد."),
      ...A.characters.map((c) => {
        const lock = lockOf(c);
        return el("div", { class: "line" },
          inp(c.name, (v) => { c.name = v.trim() || c.name; changed(); render(); }, { "aria-label": "اسم الشخصية", maxlength: 60 }),
          el("div", { class: "meta" }, `${SA.KINDS[c.kind] || c.kind} · ${c.archetype === "human" ? (c.gender === "female" ? "أنثى" : c.gender === "male" ? "ذكر" : "") : ""} ${c.age ? (SA_AGE[c.age] || "") : ""}`.trim()),
          el("label", { class: "meta" }, "من المكتبة: ",
            el("select", { "aria-label": "ربط بالمكتبة", onchange: (e) => {
              const id = Number(e.target.value);
              if (!id) { delete c.library_id; delete c.identity; }
              else { const lib = LIB.find((x) => x.id === id); c.library_id = id; c.identity = lib.identity; }
              changed(); render();
            } }, libOpts.map(([v, l]) => el("option", { value: v, selected: String(c.library_id || "") === v }, l)))),
          el("div", { class: "hint " + lock.cls }, lock.text),
          lock.fix ? btn("اعتماد الشكل الجديد", lock.fix) : "",
          btn("حذف", () => confirmDialog(`حذف «${c.name}»؟`, "ستُزال من كل المشاهد، وحواراتها تصبح للراوي.",
            async () => { removeChar(c.id); changed(); render(); }, "نعم، احذف"), "danger"));
      }),
      el("div", { class: "row" },
        btn("＋ شخصية", () => { A.characters.push({ id: nextId("c", A.characters), name: "شخصية جديدة", kind: "unknown", archetype: "human", species: "none", gender: "neutral", age: "adult" }); changed(); render(); }),
        btn("ربط الشخصيات بالمكتبة من جديد", async () => {
          try {
            const names = await saveStoryCharactersToLibrary(project, A);
            LIB = await api("/characters");
            changed(); render();
            toast(names.length ? `أُضيفت للمكتبة: ${names.join("، ")}` : "كل الشخصيات مربوطة بالفعل");
          } catch (e) { toast(e.message, true); }
        })));
  }
  const SA_AGE = { child: "طفل", teen: "مراهق", adult: "بالغ", senior: "كبير السن" };

  // ---------- المشاهد ----------
  function listEditor(title, items, rowFn, addFn, addLabel) {
    return el("div", { class: "sub" }, el("h4", {}, title),
      ...items.map((it, i) => el("div", { class: "line" }, ...rowFn(it, i),
        btn("✕", () => { items.splice(i, 1); changed(); render(); }, "danger"))),
      btn(addLabel, () => { items.push(addFn()); changed(); render(); }));
  }

  function sceneCard(s, idx) {
    const det = el("details", { class: "scene" });
    if (openScenes.has(s.id)) det.setAttribute("open", "");
    det.addEventListener("toggle", () => (det.open ? openScenes.add(s.id) : openScenes.delete(s.id)));
    const sum = el("summary", {}, `مشهد ${idx + 1}: ${s.title || "بدون عنوان"} — ${s.duration_sec} ث`);
    const chips = el("div", { class: "chips" }, ...A.characters.map((c) => {
      const cb = el("input", { type: "checkbox", checked: s.characters.includes(c.id),
        onchange: (e) => { s.characters = e.target.checked ? [...s.characters, c.id] : s.characters.filter((x) => x !== c.id); changed(); } });
      if (s.characters.includes(c.id)) cb.setAttribute("checked", "");
      return el("label", { class: "chip-check" }, cb, c.name);
    }));
    const num = (v) => Math.max(1, Math.min(3600, Math.round(Number(v) || 1)));
    det.append(sum,
      field("عنوان المشهد", inp(s.title, (v) => { s.title = v; sum.textContent = `مشهد ${idx + 1}: ${v || "بدون عنوان"} — ${s.duration_sec} ث`; changed(); }, { maxlength: 120 })),
      el("div", { class: "grid" },
        field("المكان", inp(s.location, (v) => { s.location = v; changed(); }, { maxlength: 80 })),
        field("وقت اليوم", sel(SA.TIMES, s.time_of_day || "", (v) => { s.time_of_day = v; changed(); }, "وقت اليوم")),

function renderCharacterEditor(ch) {
  stopCharPreview();
  const isNew = !ch;

    el("input", { type: "range", min: Char3D.RANGES[key][0], max: Char3D.RANGES[key][1], step: 0.05, value: P[key], "aria-label": label,

  function rebuild() { // يعيد بناء الأدوات بعد تغيّر النوع (تظهر حقول مختلفة)
    controls.replaceChildren(...controlsFor());
  }
  function resetAppearance(archetype, species) {
    const keepExpr = P.expression;
    const d = Char3D.defaults({ archetype, species, gender: P.gender, age: P.age, seed: seedOf(name || archetype) });
    P = Char3D.validate({ ...d, expression: keepExpr });
  }

  function controlsFor() {
    const human = P.archetype === "human";
    const nodes = [
      el("div", { class: "field" }, el("label", { for: "cname" }, "اسم الشخصية"),
        el("input", { id: "cname", value: name, maxlength: 60, "aria-label": "اسم الشخصية", oninput: (e) => { name = e.target.value; markDirty(); } })),
      el("div", { class: "grid" },
        el("div", {}, el("label", {}, "النوع"), sel(L.archetype, P.archetype, (v) => { resetAppearance(v, Char3D.SPECIES[v][0]); markDirty(); rebuild(); }, "نوع الشخصية")),
        human ? "" : el("div", {}, el("label", {}, "الكائن"), sel(L.species, P.species, (v) => { resetAppearance(P.archetype, v); markDirty(); rebuild(); }, "الكائن", Char3D.SPECIES[P.archetype]))),
    ];
    if (human) nodes.push(el("div", { class: "grid" },
      el("div", {}, el("label", {}, "الجنس"), sel(L.gender, P.gender, (v) => { P.gender = v; P.build = v === "male" ? 1.08 : v === "female" ? 0.96 : 1; markDirty(); rebuild(); }, "الجنس")),
      el("div", {}, el("label", {}, "العمر"), sel(L.age, P.age, (v) => { P.age = v; markDirty(); rebuild(); }, "العمر"))));
    nodes.push(el("div", { class: "grid" }, slider("height", "الطول"), slider("build", "الجسم"), slider("head", "حجم الرأس")));
    if (human) {
      nodes.push(el("div", { class: "grid" },
        el("div", {}, el("label", {}, "الشعر"), sel(L.hair, P.hair, (v) => { P.hair = v; markDirty(); }, "الشعر")),
        P.gender === "male" && P.age !== "child" ? el("div", {}, el("label", {}, "اللحية"), sel(L.beard, P.beard, (v) => { P.beard = v; markDirty(); }, "اللحية")) : ""));
      nodes.push(el("div", { class: "field" }, el("label", {}, "الملابس"), el("div", { class: "grid" },
        el("div", {}, el("label", {}, "العلوي"), sel(L.top, P.outfit.top, (v) => { P.outfit.top = v; markDirty(); }, "القطعة العلوية")),
        el("div", {}, el("label", {}, "السفلي"), sel(L.bottom, P.outfit.bottom, (v) => { P.outfit.bottom = v; markDirty(); }, "القطعة السفلية")))));
    }
    const colorKeys = human
      ? [["skin", "لون البشرة"], ["hair", "لون الشعر"], ["eyes", "لون العينين"], ["top", "لون العلوي"], ["bottom", "لون السفلي"], ["shoes", "لون الحذاء"], ["accent", "لون الإكسسوار"]]
      : P.species === "dragon"
        ? [["fur", "لون الجسم"], ["belly", "لون البطن"], ["eyes", "لون العينين"], ["wing", "لون الأجنحة"], ["accent", "لون القرون"], ["shoes", "لون المخالب"]]
        : P.species === "turtle"
          ? [["fur", "لون الجلد"], ["shell", "لون القوقعة"], ["eyes", "لون العينين"], ["accent", "لون الإكسسوار"]]
          : [["fur", "لون الفرو"], ["belly", "لون البطن"], ["eyes", "لون العينين"], ["inner_ear", "داخل الأذن"], ["accent", "لون الإكسسوار"]];
    nodes.push(el("div", { class: "field" }, el("label", {}, "الألوان"), el("div", { class: "color-grid" }, ...colorKeys.map(([k, l]) => colorInput(k, l)))));
    nodes.push(el("div", { class: "field" }, el("label", {}, "الإكسسوارات"), el("div", { class: "chips" },
      ...Char3D.ACCESSORIES.map((a) => check(L.accessories[a], P.accessories.includes(a), (on) => {
        P.accessories = on ? [...new Set([...P.accessories, a])] : P.accessories.filter((x) => x !== a); markDirty();
      })))));
    nodes.push(el("div", { class: "field" }, el("label", {}, "التعبير"), sel(Object.fromEntries(Char3D.EXPRESSIONS.map((e) => [e, e])), P.expression,
      (v) => { P.expression = v; markDirty(); }, "التعبير", Char3D.EXPRESSIONS)));
    return nodes;
  }
  const controls = el("div", { class: "card" });
  controls.replaceChildren(...controlsFor());

  // ---------- المعاينة المتحركة ----------
  const playing = { on: true, clip: "idle", t: 0, yaw: 0.35, face: Char3D.faceFor(P.expression), blink: 1, nextBlink: 2.5 };
  const clipSel = el("select", { "aria-label": "الحركة", onchange: (e) => { playing.clip = e.target.value; playing.t = 0; } },
    Object.entries(Char3D.CLIP_LABELS).map(([k, v]) => el("option", { value: k, selected: k === playing.clip }, v)));
  const playBtn = el("button", { type: "button", onclick: () => { playing.on = !playing.on; playBtn.textContent = playing.on ? "⏸ إيقاف" : "▶ تشغيل"; } }, "⏸ إيقاف");
  const yawIn = el("input", { type: "range", min: 0, max: 6.28, step: 0.05, value: playing.yaw, "aria-label": "تدوير الشخصية", oninput: (e) => (playing.yaw = Number(e.target.value)) });

  const raf = (f) => (window.requestAnimationFrame || ((cb) => setTimeout(() => cb(Date.now()), 16)))(f);
  function startPreview() {
    const gen = ++CHAR_STATE.gen; // كل معاينة لها جيل؛ أي حلقة قديمة تتوقف تلقائيًا
    if (!canvas.getContext) return;
    let last = 0;
    const loop = (ts) => {
      if (gen !== CHAR_STATE.gen || !canvas.isConnected) return;
      const dt = Math.min(0.1, last ? (ts - last) / 1000 : 0.016); last = ts;
      if (playing.on) playing.t += dt;
      playing.nextBlink -= dt;
      if (playing.nextBlink <= 0) { playing.blink = 0.1; playing.nextBlink = 2.5 + Math.random() * 2.5; }
      playing.blink = Math.min(1, playing.blink + dt * 6);
      Char3D.stepFace(playing.face, P.expression, dt);
      try {
        Char3D.render(Char3D.canvasTarget(canvas, { top: "#cfe8ff", mid: "#eaf6ff", ground: "#bfe3a8", ground2: "#a8d68f" }), P,
          { clip: playing.clip, time: playing.t, face: playing.face, blink: playing.blink }, { yaw: playing.yaw, dist: 4.2 });
      } catch (e) { status.textContent = "تعذّر الرسم: " + e.message; }
      raf(loop);
    };
    raf(loop);

  // ---------- الحفظ ----------
  async function save() {
    const body = { name: name.trim(), params: P };
    try {
      if (isNew) {

  idBadge.textContent = identityShown ? "بصمة الهوية: " + identityShown : "لم تُحفظ بعد";
  app.replaceChildren(
    el("div", { class: "row between" }, el("h1", {}, isNew ? "شخصية جديدة" : name), el("a", { class: "btn", href: "#/characters" }, "المكتبة")),

      el("div", { class: "row" }, delBtn, el("button", { type: "button", class: "primary", id: "csave", onclick: save }, isNew ? "إنشاء" : "حفظ"))));
  if (!isNew) app.insertBefore(comfyCard(ch, () => P), app.querySelector(".savebar"));
  startPreview();
}
function stopCharPreview() { CHAR_STATE.gen++; }

// يُستدعى من مكان حلّ القصة: يحفظ شخصيات التحليل في المكتبة ويربط كل واحدة بسجلها.
// يعمل تلقائيًا مع كل تحليل: شخصية بنفس الاسم في المكتبة تُربط بها بدل تكرارها.
async function saveStoryCharactersToLibrary(project, analysis) {
  const lib = await api("/characters");
  const created = [];
  for (const c of analysis.characters) {
    const still = c.library_id && lib.find((x) => x.id === c.library_id);
    if (still) continue;
    const same = lib.find((x) => x.name === c.name);
    if (same) { c.library_id = same.id; c.identity = same.identity; continue; }
    const params = Char3D.defaults({ archetype: c.archetype, species: c.species, gender: c.gender, age: c.age, seed: seedOf(c.name) });
    const saved = await api("/characters", { method: "POST", body: { name: c.name, params } });
    lib.push(saved);
    c.library_id = saved.id; c.identity = saved.identity; created.push(c.name);
  }
  return created;
}

"use strict";
// واجهة المرحلة 4: فهرس الحركات مع معاينة حيّة، ومشغّل معاينة للفيلم كاملًا.
// المعاينة تعمل داخل المتصفح بحركات تجريبية. ليست تصديرًا لفيديو، وهذا مكتوب في الواجهة نفسها.

let MOTION_STATE = { gen: 0 };
function stopMotion() { MOTION_STATE.gen++; }

// نسبة دقة الشاشة (حتى 2) لرسم أوضح على الهواتف عالية الدقة
function hiDpi() { return Math.min(2, (typeof window !== "undefined" && window.devicePixelRatio) || 1); }

// نص الزمن بصيغة دقيقة:ثانية
const fmtTime = (s) => { const m = Math.floor(s / 60), r = Math.floor(s % 60); return `${m}:${String(r).padStart(2, "0")}`; };

// شخصيات المعاينة: المحفوظة في المكتبة إن كانت مربوطة، وإلا معاملات مبنية من تحليل القصة.
function motionCharParams(analysis, lib) {
  const out = {}, warnings = [];
  for (const c of analysis.characters || []) {
    const linked = c.library_id && lib.find((x) => x.id === c.library_id);
    if (linked) {
      out[c.id] = linked.params;
      if (c.identity && linked.identity !== c.identity) warnings.push(c.name);
    } else {
      try { out[c.id] = Char3D.validate({ archetype: c.archetype, species: c.species, gender: c.gender, age: c.age }); }
      catch (e) { out[c.id] = Char3D.defaults({ archetype: "human", gender: "female", age: "adult" }); }
    }
  }
  return { params: out, warnings };
}

// ---------- فهرس الحركات ----------
async function renderMotionCatalog() {
  stopMotion();
  const gen = MOTION_STATE.gen;
  const lib = await api("/characters");
  const clips = MotionLib.catalog();
  let current = clips[0].id, elapsed = 0, last = performance.now(), paused = false;

  const canvas = el("canvas", { class: "char-canvas motion-canvas", width: Math.round(360 * hiDpi()), height: Math.round(300 * hiDpi()), "aria-label": "معاينة الحركة" });
  const title = el("strong", { id: "mo-title" }, "");
  const meta = el("p", { class: "hint", id: "mo-meta" }, "");
  const pauseBtn = el("button", { type: "button", onclick: () => { paused = !paused; pauseBtn.textContent = paused ? "▶ تشغيل" : "⏸ إيقاف"; last = performance.now(); } }, "⏸ إيقاف");

  const sel = el("select", { id: "mo-char" },
    el("option", { value: "temp" }, "شخصية معاينة مؤقتة (غير محفوظة)"),
    ...lib.map((c) => el("option", { value: String(c.id) }, c.name)));

  const select = (id) => {
    current = id; elapsed = 0; last = performance.now();
    const c = clips.find((x) => x.id === id);
    title.textContent = c.label;
    meta.textContent = `${CATEGORY_LABEL(c.category)} · ${c.duration} ث · ${c.loop ? "تتكرر" : "تتوقف عند النهاية"}`;
    app.querySelectorAll(".clip-btn").forEach((b) => b.classList.toggle("on", b.dataset.id === id));
  };
  const CATEGORY_LABEL = (k) => MotionLib.CATEGORY_LABELS[k] || k;

  const groups = Object.keys(MotionLib.CATEGORY_LABELS).map((cat) => {
    const items = clips.filter((c) => c.category === cat);
    if (!items.length) return null;

    el("div", { class: "card" },
      el("label", {}, "الشخصية للمعاينة ", sel),
      el("div", { class: "row between" }, title, pauseBtn),
      canvas, meta),
    ...groups);
  select(current);

  const target = Char3D.canvasTarget(canvas, { top: "#cfe8ff", mid: "#eaf6ff", ground: "#bfe3a8", ground2: "#a8d68f" });
  const tempParams = Char3D.validate({ archetype: "human", gender: "female", age: "child" });
  const cam = { dist: 4.2, ty: 0.9, tx: 0, pitch: 0.06, yaw: 0 };
  const loop = (now) => {
    if (gen !== MOTION_STATE.gen || !canvas.isConnected) return;
    if (!paused) elapsed += (now - last) / 1000;
    last = now;
    const c = clips.find((x) => x.id === current);
    const t = c.loop ? elapsed % c.duration : Math.min(elapsed, c.duration);
    const picked = sel.value === "temp" ? null : lib.find((x) => String(x.id) === sel.value);

    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}

// ---------- مشغّل الفيلم ----------
async function renderFilmPlayer(pid) {
  stopMotion();
  const gen = MOTION_STATE.gen;
  const project = await api(`/projects/${pid}`);
  const A = project.analysis;
  const back = el("a", { class: "btn", href: `#/p/${pid}` }, "العودة للمشروع");
  const head = el("div", { class: "row between" }, el("h1", {}, "معاينة الفيلم"), el("div", { class: "row" }, el("a", { class: "btn", href: `#/storyboard/${pid}` }, "🎞 Storyboard"), el("a", { class: "btn", href: `#/timeline/${pid}` }, "⏱ Timeline"), back));
  const honest = el("p", { class: "hint" }, "معاينة داخل المتصفح بحركات تجريبية وخلفية بسيطة. ليست فيلم فيديو مُصدَّرًا (التصدير في المرحلة 7).");
