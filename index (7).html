  }

  const lib = await api("/characters");
  const { params, warnings } = motionCharParams(A, lib);
  const film = MotionLib.buildFilm(A.scenes, params);
  const unassigned = film.scenes.reduce((n, s) => n + (s.unassigned || 0), 0);

  // ---- الحوار والصوت (المرحلة 5) ----
  const voices = await loadVoices();
  const vstat = voiceStatus(voices);
  const speaker = getSpeaker();
  const charOf = (id) => (A.characters || []).find((c) => c.id === id) || null;
  const nameOf = (id) => (charOf(id) ? charOf(id).name : "الراوي");
  const overflows = [];
  function buildLines() {
    const out = []; overflows.length = 0;
    film.scenes.forEach((fs, i) => {
      const plan = VoiceLib.planScene(A.scenes[i], (id) => VoiceLib.profileFor(charOf(id)).rate);
      for (const l of plan.lines) out.push({ ...l, start: fs.start + l.start });
      if (plan.overflow) overflows.push({ title: fs.title || `مشهد ${i + 1}`, need: plan.needSeconds, have: Math.round(fs.duration) });
    });
    return out;
  }
  let lines = buildLines();
  let soundOn = vstat.ok;
  function speakLine(l) {
    const c = charOf(l.speaker), prof = VoiceLib.profileFor(c), voice = VoiceLib.pickVoice(prof, c ? (A.characters || []).indexOf(c) : 0, voices);
    if (voice) speaker.speak(l, prof, voice);
  }
  let saveTimer = null;
  const saveVoices = () => {
    lines = buildLines();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => { try { await api(`/projects/${pid}`, { method: "PATCH", body: { analysis: A } }); } catch (e) { toast(e.message, true); } }, 500);
  };

  const [cw, chh] = aspectSize(project.aspect_ratio, Math.round(360 * Math.min(1.5, hiDpi())));
  const canvas = el("canvas", { class: "char-canvas film-canvas", width: cw, height: chh, style: project.aspect_ratio === "9:16" ? "max-width:300px" : project.aspect_ratio === "1:1" ? "max-width:420px" : "" });
  const target = Char3D.canvasTarget(canvas, { top: "#cfe8ff", mid: "#eaf6ff", ground: "#bfe3a8", ground2: "#a8d68f" });
  const playBtn = el("button", { type: "button", class: "primary" }, "▶ تشغيل");
  const restartBtn = el("button", { type: "button" }, "↺ من البداية");
  const scrub = el("input", { type: "range", min: "0", max: String(Math.round(film.duration * 100)), step: "1", value: "0", "aria-label": "موضع الفيلم" });
  const timeLbl = el("span", { class: "hint" }, `0:00 / ${fmtTime(film.duration)}`);
  const sceneLbl = el("strong", {}, "");
  const shotLbl = el("span", { class: "hint" }, "");
  const subtitle = el("p", { class: "subtitle", "aria-live": "polite" }, "");
  const soundBox = el("input", { type: "checkbox", id: "sound-on", checked: soundOn, disabled: !vstat.ok, onchange: () => { soundOn = soundBox.checked; speaker.cancel(); } });
  const soundLbl = el("label", { class: "chip-check", for: "sound-on" }, soundBox, " 🔊 الصوت");

  const sceneBtns = film.scenes.map((s, i) => el("button", {
    type: "button", class: "chip scene-jump", "data-i": String(i),
    onclick: () => { seek(s.start); },
  }, `${i + 1}. ${s.title || "مشهد"} (${fmtTime(s.start)})`));

  const warnBox = [];
  if (warnings.length) warnBox.push(el("p", { class: "hint warn" }, `⚠ شكل هذه الشخصيات تغيّر في المكتبة منذ الربط: ${warnings.join("، ")}`));
  warnBox.push(el("p", { class: `hint ${vstat.cls}` }, vstat.text));
  for (const o of overflows) warnBox.push(el("p", { class: "hint warn" }, `⚠ حوار «${o.title}» يحتاج نحو ${o.need} ثانية والمشهد ${o.have} ثانية. زِد مدة المشهد، وإلا ضُغط الحوار في العرض الصامت.`));
  if (unassigned) warnBox.push(el("p", { class: "hint" }, `${unassigned} فعل بلا شخصية محددة، نُسب تلقائيًا لأول شخصية في المشهد. يمكنك تحديدها من تحرير المشروع.`));

  app.replaceChildren(head, honest, ...warnBox,
    el("div", { class: "card" }, canvas,
      subtitle,
      el("div", { class: "row between player" }, playBtn, restartBtn, soundLbl, timeLbl),
      scrub,
      el("div", {}, sceneLbl, " ", shotLbl)),
    el("details", { class: "card", id: "voice-card" }, el("summary", {}, "أصوات الشخصيات"),
      el("p", { class: "hint" }, "الصوت التلقائي يُوزَّع على الشخصيات حسب الجنس والعمر. غيّر الصوت أو الحدّة أو السرعة لكل شخصية، ويُحفظ مع المشروع."),
      ...(A.characters || []).map((c, i) => el("div", { class: "voice-row" }, el("strong", {}, c.name), voiceControls(c, i, voices, saveVoices)))),
    el("h2", {}, "المشاهد"),
    el("div", { class: "chips" }, ...sceneBtns));

  let t = 0, playing = false, last = performance.now(), lastScene = null;
  let quality = 1.4; // دقة المجسّمات: تنخفض تلقائيًا إن كان الهاتف أبطأ من اللازم وترتفع إن كان سريعًا
  function seek(v) { speaker.cancel(); t = Math.min(film.duration, Math.max(0, v)); last = performance.now(); scrub.value = String(Math.round(t * 100)); draw(); }
  function draw() {
    const f = film.frame(t);
    // الشفاه: مع الصوت تتبع تقدّم النطق الفعلي، وبدونه تتبع جدول الحوار الزمني
    const lineNow = lines.find((l) => t >= l.start && t < l.start + l.dur);
    subtitle.textContent = lineNow ? `${nameOf(lineNow.speaker)}: ${lineNow.text}` : "";
    let mouth = null;
    if (soundOn) { for (const l of lines) { const fr = speaker.progress(l.key); if (fr !== null) { mouth = { id: l.speaker, m: VoiceLib.lipAt(l.visemes, fr) }; break; } } }
    else if (lineNow) mouth = { id: lineNow.speaker, m: VoiceLib.lipAt(lineNow.visemes, (t - lineNow.start) / lineNow.dur) };
    if (mouth) { const it = f.items.find((x) => x.id === mouth.id); if (it) it.state.face = { ...it.state.face, mo: mouth.m.mo, mw: mouth.m.mw }; }
    const t0 = performance.now();
    try {
      Char3D.renderScene(target, f.items, { ...fitCam(f.cam, canvas.width, canvas.height), quality }, f.env, f.time);
      const fa = fadeAlpha(film, t);
      if (fa > 0.001) { const cx = canvas.getContext("2d"); cx.fillStyle = `rgba(0,0,0,${fa})`; cx.fillRect(0, 0, canvas.width, canvas.height); }
    } catch (e) { /* إطار واحد فاشل لا يوقف المعاينة */ }
    const ms = performance.now() - t0;
    if (ms > 55) quality = Math.max(0.7, quality - 0.15);
    else if (ms < 18) quality = Math.min(2, quality + 0.05);
    timeLbl.textContent = `${fmtTime(t)} / ${fmtTime(film.duration)}`;
    const sc = film.scenes.find((s) => s.id === f.sceneId);
    if (f.sceneId !== lastScene) {
      lastScene = f.sceneId;
      sceneLbl.textContent = sc ? `المشهد: ${sc.title || ""}` : "";
      app.querySelectorAll(".scene-jump").forEach((b) => b.classList.toggle("on", film.scenes[+b.dataset.i].id === f.sceneId));
    }
    shotLbl.textContent = f.items.length ? `${f.items.length} شخصية في الإطار` : "لا توجد شخصيات في هذا المشهد";
  }
  playBtn.onclick = () => {
    if (t >= film.duration) t = 0;
    playing = !playing; playBtn.textContent = playing ? "⏸ إيقاف" : "▶ تشغيل"; last = performance.now();
    if (!playing) speaker.cancel();
  };
  restartBtn.onclick = () => { playing = true; playBtn.textContent = "⏸ إيقاف"; seek(0); };
  scrub.oninput = () => { playing = false; playBtn.textContent = "▶ تشغيل"; seek(Number(scrub.value) / 100); };

  const loop = (now) => {
    if (gen !== MOTION_STATE.gen || !canvas.isConnected) return;
    if (playing) {
      const prev = t;
      t += (now - last) / 1000;
      if (soundOn) for (const l of lines) if (l.start > prev && l.start <= t) speakLine(l);   // كل سطر ينطق عند موعده
      if (t >= film.duration) { t = film.duration; playing = false; playBtn.textContent = "▶ تشغيل"; }
      scrub.value = String(Math.round(t * 100));
    }
    last = now;
    draw();
    requestAnimationFrame(loop);
  };
  draw();
  requestAnimationFrame(loop);
}

"use strict";
// واجهة المرحلة 5: صفحة الأصوات (فحص جهازك وتجربة النطق مع الشفاه) وعناصر ضبط صوت كل شخصية.

let VOICE_SPEAKER = null;
const VOICE_STATE = { gen: 0 };
const SAMPLE_LINE = "مرحبا يا أصدقائي، اليوم سنذهب معا في مغامرة جميلة.";

const synthSupported = () => typeof speechSynthesis !== "undefined" && typeof SpeechSynthesisUtterance !== "undefined";
function getSpeaker() {
  if (!VOICE_SPEAKER) VOICE_SPEAKER = VoiceLib.createSpeaker({ synth: synthSupported() ? speechSynthesis : null, Utter: synthSupported() ? SpeechSynthesisUtterance : null, now: () => Date.now() });
  return VOICE_SPEAKER;
}
function stopVoice() { VOICE_STATE.gen++; if (VOICE_SPEAKER) VOICE_SPEAKER.cancel(); }

// الأصوات تُحمَّل بعد بدء الصفحة في بعض المتصفحات، فننتظر حدث voiceschanged مهلة قصيرة
function loadVoices() {
  return new Promise((resolve) => {
    if (!synthSupported()) return resolve([]);
    const v = speechSynthesis.getVoices();
    if (v.length) return resolve(v);
    const done = () => resolve(speechSynthesis.getVoices());
    if (speechSynthesis.addEventListener) speechSynthesis.addEventListener("voiceschanged", done, { once: true });
    setTimeout(done, 1200);
  });
}

// حالة الدعم بصراحة: لا نقول «يعمل» إلا إن وُجد صوت عربي فعلًا
function voiceStatus(voices) {
  if (!synthSupported()) return { ok: false, cls: "warn", text: "هذا المتصفح لا يدعم تحويل النص إلى كلام. جرّب Chrome على أندرويد. ستعمل مزامنة الشفاه بدون صوت." };
  const ar = VoiceLib.arabicVoices(voices);
  if (!ar.length) return { ok: false, cls: "warn", text: `لا يوجد صوت عربي على جهازك (الأصوات المتاحة: ${voices.length}). من إعدادات هاتفك ابحث عن «تحويل النص إلى كلام» ونزّل بيانات الصوت العربي، ثم أعد فتح الصفحة. حتى ذلك الحين تعمل الشفاه بدون صوت.` };
  return { ok: true, cls: "ok", text: `✓ ${ar.length} صوت عربي متاح على جهازك` };
}

// أدوات ضبط صوت شخصية: الصوت، والحدّة، والسرعة. onChange يحفظ التغيير.
function voiceControls(c, index, voices, onChange) {
  const prof = VoiceLib.profileFor(c);
  const ar = VoiceLib.arabicVoices(voices);
  const sel = el("select", { "aria-label": "صوت " + c.name, onchange: () => { c.voice = { ...(c.voice || {}), name: sel.value }; onChange(); } },
    el("option", { value: "" }, "تلقائي"), ...ar.map((v) => el("option", { value: v.name, selected: v.name === prof.name }, `${v.name} (${v.lang})`)));
  const pv = el("span", { class: "hint" }, prof.pitch.toFixed(2)), rv = el("span", { class: "hint" }, prof.rate.toFixed(2));
  const pitch = el("input", { type: "range", min: "0.3", max: "2", step: "0.05", value: String(prof.pitch), "aria-label": "حدة الصوت",
    oninput: () => { pv.textContent = Number(pitch.value).toFixed(2); c.voice = { ...(c.voice || {}), pitch: Number(pitch.value) }; onChange(); } });
  const rate = el("input", { type: "range", min: "0.4", max: "1.8", step: "0.05", value: String(prof.rate), "aria-label": "سرعة الكلام",
    oninput: () => { rv.textContent = Number(rate.value).toFixed(2); c.voice = { ...(c.voice || {}), rate: Number(rate.value) }; onChange(); } });
  const test = el("button", { type: "button", onclick: () => {
    const sp = getSpeaker(); sp.cancel();
    const p = VoiceLib.profileFor(c);
    if (!sp.available || !VoiceLib.arabicVoices(voices).length) { toast("لا يوجد صوت عربي للتجربة على هذا الجهاز", true); return; }
    sp.speak({ key: "t" + index, text: `مرحبا، أنا ${c.name}.`, dur: 2 }, p, VoiceLib.pickVoice(p, index, voices));
  } }, "🔊 جرّب");
  return el("div", { class: "voice-ctl" },
    el("label", {}, "الصوت", sel),
    el("label", {}, "الحدّة ", pv, pitch),
    el("label", {}, "السرعة ", rv, rate),
    test);
}

// ---------- صفحة الأصوات ----------
async function renderVoicesPage() {
  stopVoice();
  const gen = VOICE_STATE.gen;
  const voices = await loadVoices();
  const st = voiceStatus(voices);
  const lib = await api("/characters");

  const canvasW = Math.round(360 * (typeof hiDpi === "function" ? hiDpi() : 1)), canvasH = Math.round(300 * (typeof hiDpi === "function" ? hiDpi() : 1));
  const canvas = el("canvas", { class: "char-canvas motion-canvas", width: canvasW, height: canvasH, "aria-label": "وجه الشخصية أثناء الكلام" });
  const text = el("textarea", { id: "voice-text", dir: "auto", rows: "3" }, SAMPLE_LINE);
  const charSel = el("select", { id: "voice-char" }, el("option", { value: "temp" }, "شخصية معاينة مؤقتة (غير محفوظة)"),
    ...lib.map((c) => el("option", { value: String(c.id) }, c.name)));
  const ar = VoiceLib.arabicVoices(voices);
  const voiceSel = el("select", { id: "voice-pick" }, el("option", { value: "" }, "تلقائي"), ...ar.map((v) => el("option", { value: v.name }, `${v.name} (${v.lang})`)));
  const pitch = el("input", { type: "range", min: "0.3", max: "2", step: "0.05", value: "1.1", "aria-label": "حدة الصوت" });
  const rate = el("input", { type: "range", min: "0.4", max: "1.8", step: "0.05", value: "1", "aria-label": "سرعة الكلام" });
  const mode = el("p", { class: "hint", id: "voice-mode" }, "");
  const speakBtn = el("button", { type: "button", class: "primary" }, "🔊 انطق مع الشفاه");
  const silentBtn = el("button", { type: "button" }, "👄 شفاه بدون صوت");

  app.replaceChildren(
    el("div", { class: "row between" }, el("h1", {}, "الأصوات"), el("a", { class: "btn", href: "#/" }, "المشاريع")),
    el("p", { class: `hint ${st.cls}`, id: "voice-status" }, st.text),
    el("p", { class: "hint" }, "الصوت يأتي من محرك الكلام في هاتفك، لا من خدمة مدفوعة. لا يمكن تسجيله إلى ملف من المتصفح، فتضمين الصوت داخل فيديو مُصدَّر يحتاج Piper (المرحلة 7)."),
    el("div", { class: "card" }, canvas,
      el("label", {}, "الشخصية", charSel), el("label", {}, "النص", text),
      el("label", {}, "الصوت", voiceSel), el("label", {}, "الحدّة", pitch), el("label", {}, "السرعة", rate),
      el("div", { class: "row" }, speakBtn, silentBtn), mode));

  const target = Char3D.canvasTarget(canvas, { top: "#cfe8ff", mid: "#eaf6ff", ground: "#bfe3a8", ground2: "#a8d68f" });
  const tempParams = Char3D.validate({ archetype: "human", gender: "female", age: "adult" });
  let mouth = { ...VoiceLib.SHAPES.rest };
  let run = null;   // { line, silent, t0 }

  function drawFace() {
    const picked = charSel.value === "temp" ? null : lib.find((x) => String(x.id) === charSel.value);
    const face = { ...Char3D.faceFor("happy"), mo: mouth.mo, mw: mouth.mw };
    try { Char3D.render(target, (picked && picked.params) || tempParams, { clip: "idle", time: 0.5, face, blink: 1 }, { dist: 1.9, ty: 1.22, tx: 0, pitch: 0.03, yaw: 0, quality: 2 }); } catch (e) { /* إطار واحد */ }
  }
  function start(silent) {
    const sp = getSpeaker(); sp.cancel();
    const line = { key: "voice-test", text: text.value.trim() || SAMPLE_LINE };
    line.visemes = VoiceLib.toVisemes(line.text);
    line.dur = VoiceLib.estimateDuration(line.text, Number(rate.value));
    if (!silent) {
      if (!sp.available || !ar.length) { toast("لا يوجد صوت عربي على هذا الجهاز. جرّب «شفاه بدون صوت».", true); return; }
      const prof = { pitch: Number(pitch.value), rate: Number(rate.value) };
      const voice = ar.find((v) => v.name === voiceSel.value) || ar[0];
      sp.speak(line, prof, voice, () => { run = null; mouth = { ...VoiceLib.SHAPES.rest }; });
      mode.textContent = "الشفاه تتبع تقدّم النطق الفعلي" + " (" + voice.name + ")";
    } else mode.textContent = "معاينة صامتة: الشفاه على جدول زمني تقديري";
    run = { line, silent, t0: Date.now() };
  }
  speakBtn.onclick = () => start(false);
  silentBtn.onclick = () => start(true);

  const loop = () => {
    if (gen !== VOICE_STATE.gen || !canvas.isConnected) return;
    if (run) {
      const frac = run.silent ? (Date.now() - run.t0) / 1000 / run.line.dur : getSpeaker().progress(run.line.key);
      if (frac === null) mouth = { ...VoiceLib.SHAPES.rest };
      else if (frac > 1) { mouth = { ...VoiceLib.SHAPES.rest }; if (run.silent) run = null; }
      else mouth = VoiceLib.lipAt(run.line.visemes, frac);
    }
    drawFace();
    requestAnimationFrame(loop);
  };
  drawFace();
  requestAnimationFrame(loop);
}

"use strict";
// ============================================================
// المراحل 6–10: Storyboard، Timeline وتصدير الفيديو، الإعدادات والنسخ الاحتياطي وPWA،
// ComfyUI الاختياري، والاختبار الذاتي. كله داخل المتصفح بلا خادم.
// ============================================================
const KAS_THEME = { top: "#cfe8ff", mid: "#eaf6ff", ground: "#bfe3a8", ground2: "#a8d68f" };
const MOVE_LABELS = { static: "ثابتة", dolly_in: "تقريب", orbit: "دوران", pan: "تحريك جانبي", dolly_out: "ابتعاد", handheld: "كاميرا محمولة" };
const TRANSITIONS = { cut: "قطع مباشر", fade: "تلاشي عبر الأسود" };
const FADE_SEC = 0.4;
const pad2 = (n) => String(n).padStart(2, "0");
const clampN = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

// ---------- أدوات مشتركة ----------
// q = الضلع القصير بالبكسل. الأبعاد زوجية دائمًا (مطلوب لبعض ترميزات الفيديو).
function aspectSize(ar, q) {
  const even = (n) => Math.max(2, Math.round(n / 2) * 2);
  if (ar === "9:16") return [even(q), even((q * 16) / 9)];
  if (ar === "1:1") return [even(q), even(q)];
  return [even((q * 16) / 9), even(q)];
}
// الكاميرا مضبوطة للعرض 16:9. في الشاشات الأضيق نبعدها حتى تبقى الشخصيات داخل الإطار.
function fitCam(cam, w, h) {
  const k = Math.max(1, Math.sqrt(16 / 9 / (w / h)));
  return k === 1 ? cam : { ...cam, dist: cam.dist * k };
}
function fadeAlpha(film, t) {
  const sc = film.scenes;
  let i = 0;
  for (let k = 0; k < sc.length; k++) if (t >= sc[k].start) i = k;
  const cur = sc[i];
  if (!cur) return 0;
  let a = 0;
  const lt = t - cur.start;
  if (cur.transition === "fade" && lt < FADE_SEC) a = Math.max(a, 1 - lt / FADE_SEC);
  const next = sc[i + 1], rem = cur.start + cur.duration - t;
  if (next && next.transition === "fade" && rem < FADE_SEC) a = Math.max(a, 1 - rem / FADE_SEC);
  return clampN(a, 0, 1);
}
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 15000);
}
const canvasBlob = (canvas, type = "image/png", q) => new Promise((res, rej) => canvas.toBlob((b) => (b ? res(b) : rej(new Error("تعذّر تحويل الصورة"))), type, q));

function drawSubtitle(ctx, w, h, text) {
  if (!text) return;
  const fs = Math.round(h * (h > w ? 0.034 : 0.05));
  ctx.save();
  ctx.font = `700 ${fs}px "Segoe UI", Tahoma, "Noto Naskh Arabic", system-ui, sans-serif`;
  ctx.direction = "rtl"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const maxW = w * 0.9, lines = [];
  let cur = "";
  for (const wd of String(text).split(/\s+/)) {
    const tryL = cur ? cur + " " + wd : wd;
    if (ctx.measureText(tryL).width > maxW && cur) { lines.push(cur); cur = wd; } else cur = tryL;
  }
  if (cur) lines.push(cur);
  const lh = fs * 1.35, bh = lines.length * lh + fs * 0.5, y0 = h - bh - h * 0.04;
  ctx.fillStyle = "rgba(0,0,0,0.55)"; ctx.fillRect(w * 0.03, y0, w * 0.94, bh);
  ctx.fillStyle = "#fff";
  lines.forEach((ln, i) => ctx.fillText(ln, w / 2, y0 + fs * 0.25 + lh * (i + 0.5)));
  ctx.restore();
}

function srtTime(s) {
  const ms = Math.max(0, Math.round(s * 1000));
  const h = Math.floor(ms / 3600000), m = Math.floor((ms % 3600000) / 60000), sec = Math.floor((ms % 60000) / 1000), r = ms % 1000;
  return `${pad2(h)}:${pad2(m)}:${pad2(sec)},${String(r).padStart(3, "0")}`;
}
function buildSrt(lines, nameOf) {
  return lines.map((l, i) => `${i + 1}\n${srtTime(l.start)} --> ${srtTime(l.start + l.dur)}\n${nameOf ? nameOf(l.speaker) + ": " : ""}${l.text}\n`).join("\n");
}

// حوار الفيلم كله بأزمنة مطلقة (يعتمد على جدول الحوار في VoiceLib)
function buildFilmLines(A, film) {
  const out = [], overflows = [];
  const charOf = (id) => (A.characters || []).find((c) => c.id === id) || null;
  film.scenes.forEach((fs, i) => {
    const plan = VoiceLib.planScene(A.scenes[i], (id) => VoiceLib.profileFor(charOf(id)).rate);
    for (const l of plan.lines) out.push({ ...l, start: fs.start + l.start });
    if (plan.overflow) overflows.push({ index: i, title: fs.title || `مشهد ${i + 1}`, need: plan.needSeconds, have: Math.round(fs.duration) });
  });
  return { lines: out, overflows };
}
const nameFn = (A) => (id) => { const c = (A.characters || []).find((x) => x.id === id); return c ? c.name : "الراوي"; };

// يرسم إطارًا كاملًا (مشهد + شفاه + ترجمة + تلاشي) على لوحة. تُستخدم في التصدير.
function drawFilmFrame(canvas, target, film, lines, t, quality, subs, nameOf) {
  const f = film.frame(t);
  const now = lines.find((l) => t >= l.start && t < l.start + l.dur);
  if (now) {
    const it = f.items.find((x) => x.id === now.speaker);
    if (it) { const m = VoiceLib.lipAt(now.visemes, (t - now.start) / now.dur); it.state.face = { ...it.state.face, mo: m.mo, mw: m.mw }; }
  }
  Char3D.renderScene(target, f.items, { ...fitCam(f.cam, canvas.width, canvas.height), quality }, f.env, f.time);
  const ctx = canvas.getContext("2d");
  if (subs && now) drawSubtitle(ctx, canvas.width, canvas.height, `${nameOf(now.speaker)}: ${now.text}`);
  const a = fadeAlpha(film, t);
  if (a > 0.001) { ctx.fillStyle = `rgba(0,0,0,${a})`; ctx.fillRect(0, 0, canvas.width, canvas.height); }
  return f;
}

// ---------- منطق اللقطات والمدد (دوال نقية قابلة للاختبار) ----------
function setShotDuration(scene, i, d) {
  const n = scene.shots.length;
  if (n < 2) return;
  const total = Math.max(1, Number(scene.duration_sec) || 1), MIN = 0.3;
  const spans = MotionLib.shotSpans(scene, total).map((s) => s.dur);
  const nd = clampN(Number(d) || MIN, MIN, total - MIN * (n - 1));
  const others = spans.reduce((a, b, j) => a + (j === i ? 0 : b), 0), rest = total - nd;
  scene.shots.forEach((s, j) => { s.weight = (j === i ? nd : others > 0 ? (spans[j] * rest) / others : rest / (n - 1)) / total; });
}
function addShotTo(scene, shot) {
  const n = scene.shots.length, total = Math.max(1, Number(scene.duration_sec) || 1);
  const spans = MotionLib.shotSpans(scene, total);
  scene.shots.forEach((s, j) => { s.weight = ((spans[j] ? spans[j].dur : total / n) / total) * (n / (n + 1)); });
  scene.shots.push({ ...shot, weight: 1 / (n + 1) });
}
function scaleDurations(durs, target, min = 1) {
  const n = durs.length;
  if (!n) return [];
  const T = Math.max(target, n * min), sum = durs.reduce((a, b) => a + b, 0) || n;
  const out = durs.map((d) => Math.max(min, Math.round((d / sum) * T)));
  let diff = T - out.reduce((a, b) => a + b, 0), guard = 100000;
  const order = durs.map((_, i) => i).sort((a, b) => durs[b] - durs[a]);
  for (let k = 0; diff !== 0 && guard-- > 0; k++) {
    const i = order[k % n], step = diff > 0 ? 1 : -1;
    if (step < 0 && out[i] <= min) { if (out.every((x) => x <= min)) break; continue; }
    out[i] += step; diff -= step;
  }
  return out;
}

async function renderStoryboard(pid) {
  stopMotion();
  const gen = MOTION_STATE.gen;
  const project = await api(`/projects/${pid}`);
  const A = project.analysis;
  const top = el("div", { class: "row between noprint" }, el("h1", {}, "Storyboard"),
    el("div", { class: "row" }, el("a", { class: "btn", href: `#/timeline/${pid}` }, "⏱ Timeline"), el("a", { class: "btn", href: `#/p/${pid}` }, "العودة للمشروع")));
  if (!A || !A.scenes || !A.scenes.length) {
    app.replaceChildren(top, el("div", { class: "card empty" }, el("p", {}, "لا يوجد تحليل للقصة بعد."), el("p", {}, "حلّل القصة من صفحة المشروع ثم عُد هنا.")));
    return;
  }
  const lib = await api("/characters");
  const { params } = motionCharParams(A, lib);
  let film = MotionLib.buildFilm(A.scenes, params);
  const [TW, TH] = aspectSize(project.aspect_ratio, Math.round(216 * Math.min(1.5, hiDpi())));
  const subjects = () => ({ "": "— الكل / غير محدد —", ...Object.fromEntries(A.characters.map((c) => [c.id, c.name])) });
  const status = el("span", { class: "hint", role: "status" });
  let saveTimer = null;
  const save = () => {
    status.textContent = "جارٍ الحفظ…";
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      try { await api(`/projects/${pid}`, { method: "PATCH", body: { analysis: A } }); status.textContent = "تم الحفظ تلقائيًا ✓"; }
      catch (e) { status.textContent = "تعذّر الحفظ: " + e.message; }
    }, 400);
  };

  // الصور المصغرة تُرسم واحدة تلو الأخرى حتى لا يتجمد الهاتف
  const sceneThumbs = {}, sections = [];
  let token = 0;
  function drawThumb(t) {
    const spans = MotionLib.shotSpans(A.scenes[t.si], film.scenes[t.si].duration), sp = spans[t.hi];
    if (!sp) return;
    const f = film.sceneFrame(t.si, sp.start + sp.dur / 2);
    Char3D.renderScene(t.target, f.items, { ...fitCam(f.cam, t.canvas.width, t.canvas.height), quality: 1.2 }, f.env, f.time);
  }
  function drawQueue(list) {
    const my = ++token;
    let i = 0;
    const step = () => {
      if (my !== token || gen !== MOTION_STATE.gen) return;
      const t = list[i++];
      if (!t) return;
      try { drawThumb(t); } catch (e) { /* لقطة واحدة فاشلة لا توقف اللوحة */ }
      setTimeout(step, 0);
    };
    step();
  }

  function shotCard(si, hi) {
    const sc = A.scenes[si], sh = sc.shots[hi], spans = MotionLib.shotSpans(sc, film.scenes[si].duration);
    const canvas = el("canvas", { class: "thumb", width: TW, height: TH, "aria-label": `لقطة ${hi + 1}` });
    (sceneThumbs[si] ||= []).push({ canvas, target: Char3D.canvasTarget(canvas, KAS_THEME), si, hi });
    const again = () => { save(); refreshScene(si); };
    const sel = (map, value, onChange, label) => el("select", { "aria-label": label, onchange: (e) => onChange(e.target.value) },
      Object.entries(map).map(([k, v]) => el("option", { value: k, selected: k === value }, v)));
    const moveIdx = MotionLib.CAM_MOVES.includes(sh.move) ? sh.move : MotionLib.CAM_MOVES[hi % MotionLib.CAM_MOVES.length];
    const swap = (a, b) => { if (b < 0 || b >= sc.shots.length) return; [sc.shots[a], sc.shots[b]] = [sc.shots[b], sc.shots[a]]; again(); };
    return el("div", { class: "shot-card" }, canvas,
      el("div", { class: "row between" }, el("strong", {}, `لقطة ${hi + 1}`), el("span", { class: "meta" }, `${spans[hi].dur.toFixed(1)} ث`)),
      el("div", { class: "field-row noprint" },
        sel(StoryAnalyzer.SHOT_TYPES, sh.type, (v) => { sh.type = v; again(); }, "نوع اللقطة"),
        sel(subjects(), sh.subject || "", (v) => { sh.subject = v; again(); }, "موضوع اللقطة"),
        sel(MOVE_LABELS, moveIdx, (v) => { sh.move = v; again(); }, "حركة الكاميرا"),
        el("label", { class: "meta" }, "المدة (ث) ",
          el("input", { type: "number", min: "0.3", step: "0.1", value: spans[hi].dur.toFixed(1), disabled: sc.shots.length < 2, "aria-label": "مدة اللقطة",
            onchange: (e) => { setShotDuration(sc, hi, Number(e.target.value)); again(); } })),
        el("input", { value: sh.note || "", maxlength: 160, placeholder: "ملاحظة", "aria-label": "ملاحظة اللقطة", onchange: (e) => { sh.note = e.target.value; save(); } })),
      el("div", { class: "row noprint" },
        el("button", { type: "button", class: "sm", onclick: () => swap(hi, hi - 1), disabled: hi === 0 }, "→"),
        el("button", { type: "button", class: "sm", onclick: () => swap(hi, hi + 1), disabled: hi === sc.shots.length - 1 }, "←"),
        el("button", { type: "button", class: "sm danger", disabled: sc.shots.length < 2, onclick: () => { sc.shots.splice(hi, 1); again(); } }, "✕")),
      el("div", { class: "print-note" }, `${StoryAnalyzer.SHOT_TYPES[sh.type] || sh.type} · ${MOVE_LABELS[moveIdx]}${sh.note ? " — " + sh.note : ""}`));
  }

  function sceneSection(si) {
    const sc = A.scenes[si];
    sceneThumbs[si] = [];
    const dlg = (sc.dialogue || []).slice(0, 3).map((d) => `${d.speaker === "narrator" ? "الراوي" : (A.characters.find((c) => c.id === d.speaker) || {}).name || "؟"}: ${d.text}`);
    return el("section", { class: "card scene-board" },
      el("div", { class: "row between" }, el("h2", {}, `مشهد ${si + 1}: ${sc.title || "بدون عنوان"}`), el("span", { class: "meta" }, `${film.scenes[si].duration} ث`)),
      sc.summary ? el("p", { class: "meta" }, sc.summary) : "",
      ...dlg.map((d) => el("div", { class: "meta" }, "💬 " + d)),
      el("div", { class: "board-grid" }, ...sc.shots.map((_, hi) => shotCard(si, hi))),
      el("div", { class: "row noprint" }, el("button", { type: "button", class: "sm", onclick: () => {
        addShotTo(sc, { type: "medium", subject: "", note: "" }); save(); refreshScene(si);
      } }, "＋ لقطة")));
  }
  function refreshScene(si) {
    film = MotionLib.buildFilm(A.scenes, params);
    const fresh = sceneSection(si);
    sections[si].replaceWith(fresh);
    sections[si] = fresh;
    drawQueue(sceneThumbs[si]);
  }

  const exportBtn = el("button", { type: "button", class: "primary" }, "⬇ تنزيل الصور (ZIP)");
  exportBtn.onclick = async () => {
    exportBtn.disabled = true;
    try {
      const [EW, EH] = aspectSize(project.aspect_ratio, 540);
      const c = document.createElement("canvas"); c.width = EW; c.height = EH;
      const tg = Char3D.canvasTarget(c, KAS_THEME), enc = new TextEncoder();
      const root = "storyboard-" + kasFolder(project.id) + "/";
      const entries = [{ name: root, data: new Uint8Array(0) }], txt = [`Storyboard: ${project.title}`, ""];
      let n = 0;
      const total = A.scenes.reduce((s, x) => s + x.shots.length, 0);
      for (let si = 0; si < A.scenes.length; si++) {
        const sc = A.scenes[si], spans = MotionLib.shotSpans(sc, film.scenes[si].duration);
        txt.push(`مشهد ${si + 1}: ${sc.title || ""} (${film.scenes[si].duration} ث)`);
        for (let hi = 0; hi < sc.shots.length; hi++) {
          const f = film.sceneFrame(si, spans[hi].start + spans[hi].dur / 2);
          Char3D.renderScene(tg, f.items, { ...fitCam(f.cam, EW, EH), quality: 2 }, f.env, f.time);
          const bytes = new Uint8Array(await (await canvasBlob(c)).arrayBuffer());
          entries.push({ name: `${root}scene-${pad2(si + 1)}-shot-${pad2(hi + 1)}.png`, data: bytes });
          const sh = sc.shots[hi];
          txt.push(`  لقطة ${hi + 1}: ${StoryAnalyzer.SHOT_TYPES[sh.type] || sh.type} · ${spans[hi].dur.toFixed(1)} ث${sh.note ? " · " + sh.note : ""}`);
          status.textContent = `جارٍ تجهيز الصور… ${++n}/${total}`;
          await new Promise((r) => setTimeout(r, 0));
        }
        txt.push("");
      }
      entries.push({ name: root + "storyboard.txt", data: enc.encode(txt.join("\n")) });
      downloadBlob(new Blob([kasBuildZip(entries)], { type: "application/zip" }), `storyboard-${kasFolder(project.id)}.zip`);
      status.textContent = "تم تنزيل الصور ✓";
    } catch (e) { toast(e.message, true); status.textContent = ""; }
    finally { exportBtn.disabled = false; }
  };

  const secEls = A.scenes.map((_, si) => sceneSection(si));
  sections.push(...secEls);
  app.replaceChildren(top,
    el("p", { class: "hint noprint" }, "كل صورة مرسومة بنفس محرك المعاينة والكاميرا التي يستخدمها الفيلم، فما تراه هنا هو ما سيظهر. عدّل نوع اللقطة أو موضوعها أو حركة الكاميرا أو مدتها وتُحفظ تلقائيًا."),
    el("div", { class: "row noprint" }, exportBtn, el("button", { type: "button", onclick: () => window.print() }, "🖨 طباعة / PDF"), status),
    ...secEls);
  const all = []; for (const k of Object.keys(sceneThumbs)) all.push(...sceneThumbs[k]);
  drawQueue(all);
}

// المرحلة 7: Timeline وتصدير الفيديو (MediaRecorder داخل المتصفح)
// ============================================================
// ---------- المرحلة 1: مزج الصوت وإدخاله في الفيديو ----------
// الموسيقى والمؤثرات تُولَّد برمجيًا وتُسجَّل فعلاً داخل الفيديو. صوت الحوار يأتي من خادم TTS (studio-server.js) لأن
// واجهة الكلام في المتصفح لا تعطي ملفًا يمكن تسجيله. دون الخادم يُصدَّر الفيديو بلا حوار مسموع ويُقال ذلك صراحة.
const AudioMix = (() => {
  const KEY = "kas_audio_v1";
  const DEF = { master: 1, dialogue: 1, music: 0.3, sfx: 0.6, musicOn: true, sfxOn: true, ttsOn: false, ttsVoices: "" };
  let mem = null;
  const settings = () => { if (mem) return mem; let s = {}; try { s = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { /* افتراضي */ } return (mem = { ...DEF, ...(s && typeof s === "object" ? s : {}) }); };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) { /* ممنوع */ } };
  async function status() {
    try { const r = await fetch("/api/tts/status", { cache: "no-store" }); if (!r.ok) throw new Error("x"); return await r.json(); }
    catch (e) { return { available: false, reason: "خادم الاستوديو غير مشغّل. شغّله بالأمر node studio-server.js ليعمل صوت الحوار في الفيديو." }; }
  }
  function session() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) throw new Error("هذا المتصفح لا يدعم WebAudio");
    const ctx = new AC(), dest = ctx.createMediaStreamDestination(), s = settings();
    const master = ctx.createGain(), bd = ctx.createGain(), bm = ctx.createGain(), bs = ctx.createGain();
    master.gain.value = s.master; bd.gain.value = s.dialogue; bm.gain.value = s.music; bs.gain.value = s.sfx;
    bd.connect(master); bm.connect(master); bs.connect(master); master.connect(dest);
    return { ctx, dest, bd, bm, bs };
  }
  async function generateClips(sess, lines, onStep) {
    const s = settings(), voices = String(s.ttsVoices || "").split(",").map((x) => x.trim()).filter(Boolean);
    const order = [...new Set(lines.map((l) => l.speaker))], out = [];
    try {
      for (let i = 0; i < lines.length; i++) {
        onStep(i, lines.length);
        const voice = voices.length ? voices[order.indexOf(lines[i].speaker) % voices.length] : "";   // نفس الصوت لنفس الشخصية دائمًا
        const r = await fetch("/api/tts", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: lines[i].text, voice, speed: 1 }) });
        if (!r.ok) { let m = ""; try { m = (await r.json()).error; } catch (e) { /* بلا نص */ } throw new Error(`فشل توليد صوت السطر ${i + 1}: ${m || "HTTP " + r.status}`); }
        out.push(await sess.ctx.decodeAudioData(await r.arrayBuffer()));
      }
    } catch (e) { try { sess.ctx.close(); } catch (e2) { /* مُغلق */ } throw e; }
    return out;
  }
  function whoosh(sess, at) {
    const { ctx } = sess, n = Math.floor(ctx.sampleRate * 0.6), buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = buf; f.type = "bandpass"; f.Q.value = 1.2;
    f.frequency.setValueAtTime(400, at); f.frequency.exponentialRampToValueAtTime(3000, at + 0.5);
    g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(0.5, at + 0.25); g.gain.linearRampToValueAtTime(0, at + 0.6);
    src.connect(f); f.connect(g); g.connect(sess.bs); src.start(at);
  }
  const CHORDS = [[261.63, 329.63, 392], [220, 261.63, 329.63], [174.61, 220, 261.63], [196, 246.94, 293.66]];
  function schedule(sess, film, lines, clips, t0) {
    const s = settings(), { ctx } = sess;
    if (clips) lines.forEach((l, i) => { if (!clips[i]) return; const src = ctx.createBufferSource(); src.buffer = clips[i]; src.connect(sess.bd); src.start(t0 + l.start); });
    if (s.musicOn) for (let t = 0, k = 0; t < film.duration; t += 4, k++) {
      for (const hz of CHORDS[k % 4]) {
        const o = ctx.createOscillator(), g = ctx.createGain(), T = t0 + t;
        o.type = "triangle"; o.frequency.value = hz;
        g.gain.setValueAtTime(0, T); g.gain.linearRampToValueAtTime(0.12, T + 0.8); g.gain.linearRampToValueAtTime(0, T + 4);
        o.connect(g); g.connect(sess.bm); o.start(T); o.stop(T + 4.1);
      }
    }
    if (s.sfxOn) film.scenes.forEach((fs, i) => { if (i > 0) whoosh(sess, t0 + Math.max(0, fs.start - 0.15)); });
  }
  return { settings, save, status, session, generateClips, schedule };
})();

function audioPanel() {
  const s = AudioMix.settings();
  const slider = (label, key) => {
    const v = el("span", { class: "hint" }, Math.round(s[key] * 100) + "%");
    const r = el("input", { type: "range", min: "0", max: "1", step: "0.05", value: String(s[key]), "aria-label": label, oninput: () => { s[key] = Number(r.value); v.textContent = Math.round(s[key] * 100) + "%"; AudioMix.save(); } });

function pickVideoMime() {
  if (typeof MediaRecorder === "undefined" || !MediaRecorder.isTypeSupported) return null;
  const list = ["video/mp4;codecs=avc1.42E01E", "video/mp4", "video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"];
  return list.find((m) => { try { return MediaRecorder.isTypeSupported(m); } catch (e) { return false; } }) || null;
}

// يسجّل الفيلم بالزمن الحقيقي من لوحة مخفية. الصوت لا يُسجَّل (واجهة الكلام في المتصفح لا تعطي ملفًا).
async function exportFilmVideo({ film, lines, aspect, q, fps, subs, nameOf, onProgress, shouldStop, sess, clips }) {
  const mime = pickVideoMime();
  if (!mime || !HTMLCanvasElement.prototype.captureStream) throw new Error("هذا المتصفح لا يدعم تسجيل الفيديو من الصفحة. جرّب Chrome.");
  const [w, h] = aspectSize(aspect, q);
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  const target = Char3D.canvasTarget(canvas, KAS_THEME);
  const stream = canvas.captureStream(fps);
  if (sess) { await sess.ctx.resume(); sess.dest.stream.getAudioTracks().forEach((t) => stream.addTrack(t)); }
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: Math.round(w * h * fps * 0.12) });
  const chunks = [];
  rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
  const stopped = new Promise((res, rej) => { rec.onstop = res; rec.onerror = (e) => rej((e && e.error) || new Error("فشل التسجيل")); });
  let wake = null;
  try { if (navigator.wakeLock) wake = await navigator.wakeLock.request("screen"); } catch (e) { /* اختياري */ }
  let quality = 1.4, aborted = false;
  try {
    drawFilmFrame(canvas, target, film, lines, 0, quality, subs, nameOf);
    rec.start(500);
    const t0 = performance.now();
    if (sess) AudioMix.schedule(sess, film, lines, clips, sess.ctx.currentTime + 0.05);
    await new Promise((resolve) => {
      const loop = () => {
        if (shouldStop()) { aborted = true; return resolve(); }
        const t = Math.min(film.duration, (performance.now() - t0) / 1000), s = performance.now();
        try { drawFilmFrame(canvas, target, film, lines, t, quality, subs, nameOf); } catch (e) { /* إطار واحد فاشل */ }
        const ms = performance.now() - s;
        if (ms > 1000 / fps) quality = Math.max(0.7, quality - 0.1); else if (ms < 0.4 * (1000 / fps)) quality = Math.min(2, quality + 0.05);
        onProgress(t / film.duration);
        if (t >= film.duration) return resolve();
        requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);
    });
    if (!aborted) { drawFilmFrame(canvas, target, film, lines, film.duration, quality, subs, nameOf); await new Promise((r) => setTimeout(r, 350)); }
  } finally {
    try { if (rec.state !== "inactive") rec.stop(); } catch (e) { /* مُنتهٍ */ }
    try { wake && wake.release(); } catch (e) { /* مُحرَّر */ }
    try { sess && sess.ctx.close(); } catch (e) { /* مُغلق */ }
  }
  await stopped;
  stream.getTracks().forEach((t) => t.stop());
  if (aborted) throw new Error("أُلغي التصدير");
  const blob = new Blob(chunks, { type: mime.split(";")[0] });
  if (!blob.size) throw new Error("لم يُنتج التسجيل أي بيانات");
  return { blob, mime, w, h, ext: mime.startsWith("video/mp4") ? "mp4" : "webm" };
}

      const name = kasCharName(ch.name), params = Char3D.validate(ch.params || {});
      const n = { id: db.nextCharId++, name, params, identity: Char3D.identity(params), created_at: ch.created_at || kasNow(), updated_at: ch.updated_at || kasNow() };
      if (ch.ref_image) { try { n.ref_image = kasRef(ch.ref_image); } catch (e) { /* صورة تالفة: نتجاهلها */ } }
      db.chars.push(n); map.set(ch.id, n); c++;
    } catch (e) { skipped++; }
  }
  for (const pr of obj.projects) {
    try {
      const valid = kasValidate({ ...KAS_DEFAULTS, ...pick(pr) });
      const analysis = pr.analysis ? kasClone(kasValidateAnalysis(pr.analysis)) : null;
      if (analysis) for (const ac of analysis.characters) {
        if (ac.library_id != null) { const n = map.get(ac.library_id); if (n) { ac.library_id = n.id; ac.identity = n.identity; } else { delete ac.library_id; delete ac.identity; } }
      }
      const now = kasNow();
      db.projects.push({ id: db.nextId++, ...valid, analysis, created_at: pr.created_at || now, updated_at: pr.updated_at || now });
      p++;
    } catch (e) { skipped++; }
  }
  kasSave(db);
  return { projects: p, characters: c, skipped };
}

const ComfyLib = (() => {
  const base = (u) => String(u || "").trim().replace(/\/+$/, "");
  async function jfetch(url, opts = {}, ms = 8000) {
    const ctl = new AbortController(), id = setTimeout(() => ctl.abort(), ms);
    try {
      const r = await fetch(url, { ...opts, signal: ctl.signal });
      if (!r.ok) { const t = await r.text().catch(() => ""); throw new Error(`HTTP ${r.status}` + (t ? ": " + t.slice(0, 200) : "")); }
      return r;
    } finally { clearTimeout(id); }
  }
  const test = async (u) => (await jfetch(base(u) + "/system_stats")).json();
  async function checkpoints(u) {
    const j = await (await jfetch(base(u) + "/object_info/CheckpointLoaderSimple")).json();
    const req = ((j.CheckpointLoaderSimple || {}).input || {}).required || {};
    return (req.ckpt_name && req.ckpt_name[0]) || [];
  }
  function explain(e, u) {
    const https = typeof location !== "undefined" && location.protocol === "https:" && /^http:\/\//i.test(u) && !/\/\/(localhost|127\.0\.0\.1)/i.test(u);
    if (e && e.name === "AbortError") return "انتهت المهلة. تأكد أن ComfyUI يعمل وأن العنوان صحيح.";
    if (https) return "المتصفح يمنع صفحة https من الاتصال بعنوان http. افتح هذه الصفحة من ملف محلي أو شغّل ComfyUI خلف https.";
    if (e && /Failed to fetch|NetworkError|Load failed/i.test(e.message)) return "تعذّر الوصول. تأكد أن ComfyUI يعمل، وأنه بدأ بخيار --enable-cors-header، وأن الهاتف والحاسوب على نفس الشبكة.";
    return "تعذّر الاتصال: " + (e && e.message);
  }
  function buildWorkflow({ ckpt, prompt, negative, seed, width = 512, height = 768, steps = 20, cfg = 7 }) {
    return {
      3: { class_type: "KSampler", inputs: { seed, steps, cfg, sampler_name: "euler", scheduler: "normal", denoise: 1, model: ["4", 0], positive: ["6", 0], negative: ["7", 0], latent_image: ["5", 0] } },
      4: { class_type: "CheckpointLoaderSimple", inputs: { ckpt_name: ckpt } },
      5: { class_type: "EmptyLatentImage", inputs: { width, height, batch_size: 1 } },
      6: { class_type: "CLIPTextEncode", inputs: { text: prompt, clip: ["4", 1] } },
      7: { class_type: "CLIPTextEncode", inputs: { text: negative, clip: ["4", 1] } },
      8: { class_type: "VAEDecode", inputs: { samples: ["3", 0], vae: ["4", 2] } },
      9: { class_type: "SaveImage", inputs: { filename_prefix: "kids3d", images: ["8", 0] } },
    };
  }
  async function run(u, wf, { timeoutMs = 240000, onStatus = () => {}, shouldStop = () => false } = {}) {
    const b = base(u);
    const sent = await (await jfetch(b + "/prompt", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ prompt: wf, client_id: "kids3d-" + Date.now() }) })).json();
    const id = sent.prompt_id;
    if (!id) throw new Error("لم يُرجع ComfyUI رقم المهمة");
    const t0 = Date.now();
    while (Date.now() - t0 < timeoutMs) {
      if (shouldStop()) throw new Error("أُلغي التوليد");
      await new Promise((r) => setTimeout(r, 1500));
      const h = await (await jfetch(b + "/history/" + id)).json();
      const entry = h[id];
      if (entry && entry.outputs) {
        for (const o of Object.values(entry.outputs)) {
          const im = o.images && o.images[0];
          if (im) return (await jfetch(`${b}/view?filename=${encodeURIComponent(im.filename)}&subfolder=${encodeURIComponent(im.subfolder || "")}&type=${encodeURIComponent(im.type || "output")}`, {}, 30000)).blob();
        }
        throw new Error("انتهت المهمة دون صورة");
      }
      onStatus(Math.round((Date.now() - t0) / 1000));
    }
    throw new Error("استغرق التوليد وقتًا أطول من اللازم");
  }

  const COLORS = [["black", "#000000"], ["white", "#ffffff"], ["red", "#e02020"], ["orange", "#ff8000"], ["yellow", "#f5d800"], ["green", "#20a040"], ["blue", "#2050e0"],
    ["purple", "#8030c0"], ["pink", "#ff80b0"], ["brown", "#7a4a20"], ["gray", "#808080"], ["beige", "#e8d4b0"], ["tan", "#d9a27c"], ["dark brown", "#4a2c1a"], ["golden", "#d9b36b"]];
  function colorName(hex) {
    const h = /^#[0-9a-f]{6}$/i.test(hex || "") ? hex : "#808080", rgb = [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
    let best = COLORS[0], bd = Infinity;
    for (const c of COLORS) { const d = [1, 3, 5].reduce((s, i, k) => s + (parseInt(c[1].slice(i, i + 2), 16) - rgb[k]) ** 2, 0); if (d < bd) { bd = d; best = c; } }
    return best[0];
  }
  const STYLE = { soft3d: "soft 3D cartoon character render, smooth rounded shapes, studio lighting", lowpoly: "low poly 3D character, faceted shapes, flat shading", clay: "claymation clay figure, handmade look, soft lighting" };
  function charPrompt(p, style = "soft3d") {
    const c = p.colors || {};
    let subj, det = [];
    if (p.archetype === "human") {
      const w = { child: { male: "little boy", female: "little girl", neutral: "small child" }, teen: { male: "teenage boy", female: "teenage girl", neutral: "teenager" },
        adult: { male: "man", female: "woman", neutral: "person" }, senior: { male: "old man", female: "old woman", neutral: "elderly person" } };
      subj = (w[p.age] || w.adult)[p.gender] || "person";
      det.push(`${colorName(c.skin)} skin tone`);
      det.push(p.hair === "none" ? "bald" : `${colorName(c.hair)} ${{ short: "short", long: "long", bun: "hair in a bun", curly: "curly" }[p.hair] || ""} hair`.replace("hair in a bun hair", "hair in a bun"));
      if (p.beard !== "none") det.push(p.beard === "full" ? "full beard" : "light stubble");
      const top = { shirt: "shirt", tshirt: "t-shirt", robe: "long robe" }[p.outfit.top], bottom = { pants: "pants", shorts: "shorts", skirt: "skirt", dress: "dress" }[p.outfit.bottom];
      if (top) det.push(`${colorName(c.top)} ${top}`);
      if (bottom) det.push(`${colorName(c.bottom)} ${bottom}`);
    } else if (p.archetype === "creature") { subj = "friendly cartoon dragon"; det.push(`${colorName(c.fur)} body`, `${colorName(c.wing)} wings`); }
    else { subj = { rabbit: "cute rabbit", turtle: "cute turtle", generic: "cute cartoon animal" }[p.species] || "cute cartoon animal"; det.push(`${colorName(c.fur)} fur`); if (p.species === "turtle") det.push(`${colorName(c.shell)} shell`); }
    det.push(`${colorName(c.eyes)} eyes`);
    const acc = { hat: "wearing a hat", cape: "wearing a cape", crown: "wearing a crown", glasses: "wearing glasses", bow: "with a bow tie" };
    for (const a of p.accessories || []) if (acc[a]) det.push(acc[a]);
    return {
      prompt: `${STYLE[style] || STYLE.soft3d}, full body, ${subj}, ${det.join(", ")}, standing, plain light background, children's animation style, friendly, cute`,
      negative: "text, watermark, scary, realistic photo, deformed, extra limbs, blurry, nsfw, dark",
    };
  }
  async function toSmallJpeg(blob, maxSide = 384) {
    const bmp = await createImageBitmap(blob), k = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(bmp.width * k)); c.height = Math.max(1, Math.round(bmp.height * k));
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", 0.82);
  }
  return { test, checkpoints, explain, buildWorkflow, run, charPrompt, colorName, toSmallJpeg };
})();

// بطاقة الصورة المرجعية داخل محرر الشخصية (تظهر للشخصيات المحفوظة فقط)
function comfyCard(ch, getParams) {
  const S = kasGetSettings();
  const card = el("div", { class: "card", id: "comfy-card" }, el("h2", {}, "صورة مرجعية (ComfyUI — اختياري)"));
  if (!S.comfy_url || !S.comfy_ckpt) {
    card.append(el("p", { class: "hint" }, "لتوليد صورة مرجعية للشخصية اضبط عنوان ComfyUI واختر نموذجًا من ", el("a", { href: "#/settings" }, "الإعدادات"), "."));
    if (ch.ref_image) card.append(el("img", { class: "ref-img", src: ch.ref_image, alt: "صورة مرجعية" }));
    return card;
  }
  const box = el("div", {}), status = el("p", { class: "hint", role: "status" }, "");
  let current = ch.ref_image || null, ctl = null;
  const show = () => box.replaceChildren(current ? el("img", { class: "ref-img", src: current, alt: "صورة مرجعية" }) : el("p", { class: "hint" }, "لا توجد صورة بعد."));
  const gen = el("button", { type: "button", class: "primary" }, "توليد صورة"), cancel = el("button", { type: "button", hidden: true }, "إلغاء");
  const save = el("button", { type: "button" }, "حفظ مع الشخصية"), del = el("button", { type: "button", class: "danger" }, "إزالة");
  cancel.onclick = () => { if (ctl) ctl.stop = true; };
  gen.onclick = async () => {
    ctl = { stop: false }; gen.disabled = true; cancel.hidden = false;
    try {
      const { prompt, negative } = ComfyLib.charPrompt(getParams(), "soft3d");
      status.className = "hint"; status.textContent = "جارٍ التوليد…";
      const wf = ComfyLib.buildWorkflow({ ckpt: S.comfy_ckpt, prompt, negative, seed: Math.floor(Math.random() * 2 ** 31) });
      const blob = await ComfyLib.run(S.comfy_url, wf, { onStatus: (s) => (status.textContent = `جارٍ التوليد… ${s} ث`), shouldStop: () => ctl.stop });
      current = await ComfyLib.toSmallJpeg(blob, 384); show();
      status.className = "hint ok"; status.textContent = "✓ تم. اضغط «حفظ مع الشخصية» إن أعجبتك.";
    } catch (e) { status.className = "hint warn"; status.textContent = ComfyLib.explain(e, S.comfy_url); }
    finally { gen.disabled = false; cancel.hidden = true; }
  };
  const persist = async (val, msg) => { try { await api(`/characters/${ch.id}`, { method: "PATCH", body: { ref_image: val } }); ch.ref_image = val; toast(msg); } catch (e) { toast(e.message, true); } };
  save.onclick = () => (current ? persist(current, "تم حفظ الصورة المرجعية") : toast("ولّد صورة أولًا", true));
  del.onclick = () => { current = null; show(); persist(null, "أُزيلت الصورة"); };
  show();
  card.append(el("p", { class: "hint" }, "الوصف يُبنى تلقائيًا من مظهر الشخصية الحالي (النوع والعمر والألوان والملابس)."), box, el("div", { class: "row" }, gen, cancel, save, del), status);
  return card;
}

const SELFTEST_STORY = "كان أرنب صغير اسمه زهرة يعيش في الغابة. ذهبت زهرة إلى النهر في الصباح.\n\nقابلت زهرة سلحفاة عجوزة اسمها سلمى. قالت زهرة: «صباح الخير يا سلمى!»\n\nضحكت سلمى وقالت: «أهلا يا زهرة». ثم جلست الاثنتان قرب الشجرة.";

async function withSandbox(fn) {

  kasMemory = kasNormalize({ nextId: 1, projects: [] });

async function runSelfTests(onRow) {
  const out = { pass: 0, fail: 0, skip: 0, rows: [] };
  for (const [name, fn] of selfTests()) {
    const t0 = performance.now();
    let row;
    try { const r = await fn(); row = r && r.skip ? { name, status: "skip", note: r.skip } : { name, status: "pass" }; }
    catch (e) { row = { name, status: "fail", note: e.message }; }
    row.ms = Math.round(performance.now() - t0);
    out[row.status]++; out.rows.push(row); if (onRow) onRow(row);
  }
  return out;
}

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) node.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) node.append(c instanceof Node ? c : document.createTextNode(c ?? ""));
  return node;
}

      el("p", { class: "hint" }, "هذه الإعدادات تُحفظ مع المشروع وسيستخدمها محلل القصة والمحرك في المراحل القادمة.")),
    el("div", { class: "savebar" },
      el("a", { class: "btn", href: "#/" }, "رجوع"),
      el("div", { class: "row" },
        isNew ? "" : el("button", { type: "button", class: "danger", id: "del" }, "حذف"),
        isNew ? "" : el("button", { type: "button", onclick: () => downloadProjectZip(p.id).catch((e) => toast(e.message, true)) }, "تصدير ZIP"),
        el("button", { type: "submit", class: "primary", id: "save" }, isNew ? "إنشاء المشروع وتحليل القصة" : "حفظ"))));

  const heading = el("h1", {}, isNew ? "مشروع جديد" : p.title);
  const phases = el("div", { class: "card" }, el("h2", {}, "مراحل البناء"),
    ...PHASES.map(([n, label, st]) => el("div", { class: "phase" },
      el("span", { class: st === "done" ? "ok" : "no" }, st === "done" ? "✔ مكتملة" : "قادمة"),
      el("span", {}, `${n}. ${label}`))),
    el("p", { class: "hint" }, "التصدير يعمل داخل المتصفح (فيديو بدون صوت). دمج الصوت وFFmpeg وBlender تحتاج نسخة الخادم، ولذلك لا توجد أزرار لها هنا."));

  app.replaceChildren(heading, form, ...(isNew ? [] : [renderAnalysisPanel(p, form), phases]));

  const story = form.elements.story, count = form.querySelector("#count");
  const upd = () => (count.textContent = `${story.value.length.toLocaleString("ar-EG")} حرف`);
  story.addEventListener("input", upd); upd();

  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    form.querySelectorAll("[data-err]").forEach((n) => (n.textContent = ""));
    const body = Object.fromEntries(new FormData(form));
    body.duration_sec = Number(body.duration_sec);
    const btn = form.querySelector("#save"); btn.disabled = true;
    try {
      if (isNew) {
        const created = await api("/projects", { method: "POST", body });
        PENDING_ANALYZE = !!(body.story || "").trim(); // قصة مكتوبة: حلّلها مباشرة بعد الإنشاء
        toast(PENDING_ANALYZE ? "تم إنشاء المشروع، جارٍ تحليل القصة" : "تم إنشاء المشروع");
        go(`#/p/${created.id}`);
      } else {
        const saved = await api(`/projects/${p.id}`, { method: "PATCH", body });
        heading.textContent = saved.title;
        toast("تم الحفظ");
      }
    } catch (e) {
      for (const d of e.details || []) {
        const slot = form.querySelector(`[data-err="${d.field}"]`);
        if (slot) slot.textContent = d.message;
      }
      toast(e.message, true);
    } finally { btn.disabled = false; }
  });

  const del = form.querySelector("#del");
  if (del) del.addEventListener("click", () => confirmDialog(
    `حذف «${p.title}» نهائيًا؟`, "سيُحذف المشروع ومجلده وكل ملفاته. لا يمكن التراجع.",
    async () => { await api(`/projects/${p.id}`, { method: "DELETE" }); toast("تم الحذف"); go("#/"); }));
}

function confirmDialog(title, text, onYes, yesLabel = "نعم، احذف") {
  const dlg = document.getElementById("dlg");
  const close = () => dlg.close();
  dlg.replaceChildren(el("h2", {}, title), el("p", {}, text),
    el("div", { class: "row between" },
      el("button", { type: "button", onclick: close }, "إلغاء"),
      el("button", { type: "button", class: "danger", onclick: async () => {
        try { await onYes(); } catch (e) { toast(e.message, true); }
        close();
      } }, yesLabel)));
  dlg.showModal();
}

// ---------- حالة الأدوات ----------
async function showStatus() {
  const dlg = document.getElementById("dlg");
  dlg.replaceChildren(el("p", {}, "جارٍ الفحص…")); dlg.showModal();
  try {
    const h = await api("/health");
    dlg.replaceChildren(el("h2", {}, "حالة الأدوات على الخادم"),
      ...h.tools.map((t) => el("div", { class: "tool" },
        el("div", {}, el("strong", {}, t.name), el("div", { class: "meta" }, t.purpose),
          t.version ? el("div", { class: "meta", dir: "ltr" }, t.version) : ""),
        el("span", { class: t.available ? "ok" : "no" }, t.available ? "متوفرة" : "غير متاحة في هذا الوضع"))),
      el("p", { class: "hint" }, `إصدار البرنامج ${h.version}. هذا ملف واحد يعمل داخل المتصفح بلا خادم، لذلك لا يستطيع تشغيل FFmpeg أو Blender أو Piper. المرحلة الحالية لا تحتاجها.`),
      el("button", { type: "button", onclick: () => dlg.close() }, "إغلاق"));
  } catch (e) { dlg.replaceChildren(el("p", {}, e.message), el("button", { onclick: () => dlg.close() }, "إغلاق")); }
}


// ---------- المعاينة السينمائية (Three.js) ----------
let CINEMA = null;
async function renderCinema() {
  if (CINEMA) { try { CINEMA.dispose(); } catch (e) { /* مُنتهٍ */ } CINEMA = null; }
  const box = el("div", { class: "card" });
  const note = el("p", { class: "hint" }, "");
  app.replaceChildren(el("h1", {}, "🎥 المعاينة السينمائية (تجريبية)"), box, note,
    el("p", { class: "hint" }, "مشهد اختبار: شاطئ وقت الغروب بمحيط وموج وصخور وشخصية بهيكل عظمي تمشي وكاميرا تتبّع. هذه طبقة جديدة بجانب المحرك القديم، ولم تُربط بعد بقصتك."));
  if (!window.Stage3D || !Stage3D.available()) {
    note.className = "hint warn";
    note.textContent = "ملفات Three.js غير موجودة بجانب index.html. ارفع three.min.js وGLTFLoader.js وstage3d.js وSoldier.glb على الاستضافة.";
    return;
  }
  try {
    CINEMA = Stage3D.create(box);
    note.textContent = "جارٍ تحميل الموديل…";
    const poll = setInterval(() => {
      if (!CINEMA) return clearInterval(poll);
      if (CINEMA.state.loaded) { note.className = "hint ok"; note.textContent = "✓ الموديل والحركة يعملان."; clearInterval(poll); }
      else if (CINEMA.state.error) { note.className = "hint warn"; note.textContent = CINEMA.state.error; clearInterval(poll); }
    }, 400);
  } catch (e) { note.className = "hint warn"; note.textContent = "تعذّر تشغيل WebGL على هذا المتصفح: " + e.message; }
}
window.addEventListener("hashchange", () => { if (CINEMA && location.hash !== "#/cinema") { try { CINEMA.dispose(); } catch (e) { /* مُنتهٍ */ } CINEMA = null; } });

// ---------- التوجيه ----------
async function route() {
  stopMotion(); // إيقاف أي معاينة حركة قيد التشغيل قبل تغيير الصفحة
  stopVoice();  // وأي كلام جارٍ
  const hash = CURRENT || location.hash || "#/";
  try {
    if (!OPTIONS) OPTIONS = await api("/options");
    let m;
    if (hash === "#/voices") await renderVoicesPage();
    else if ((m = hash.match(/^#\/storyboard\/(\d+)$/))) await renderStoryboard(m[1]);
    else if ((m = hash.match(/^#\/timeline\/(\d+)$/))) await renderTimeline(m[1]);
    else if (hash === "#/cinema") await renderCinema();
    else if (hash === "#/settings") await renderSettings();
    else if (hash === "#/selftest") await renderSelfTest();
    else if (hash === "#/motion") await renderMotionCatalog();
    else if ((m = hash.match(/^#\/play\/(\d+)$/))) await renderFilmPlayer(m[1]);
    else if (hash === "#/characters") await renderCharacterList();
    else if (hash === "#/characters/new") renderCharacterEditor(null);
    else if ((m = hash.match(/^#\/characters\/(\d+)$/))) renderCharacterEditor(await api(`/characters/${m[1]}`));
    else if (hash === "#/new") renderEditor(null);
    else if ((m = hash.match(/^#\/p\/(\d+)$/))) renderEditor(await api(`/projects/${m[1]}`));
    else await renderList();
    window.scrollTo(0, 0);
  } catch (e) {
    app.replaceChildren(el("div", { class: "card empty" }, el("p", {}, e.message),
      el("a", { class: "btn", href: "#/" }, "العودة للمشاريع")));
  }
}

document.getElementById("status-btn").addEventListener("click", showStatus);
window.addEventListener("hashchange", () => { if (location.hash === CURRENT) return; CURRENT = location.hash; route(); });
route();


if (!kasStorageWorks()) {
  const b = document.createElement("div");
  b.className = "card";
  b.style.cssText = "margin:12px 16px;border-color:var(--danger)";
  b.textContent = "تنبيه: المتصفح يمنع الحفظ الدائم لهذا الملف، فستضيع مشاريعك عند إغلاق الصفحة. افتح الملف من استضافة (رابط https) أو صدّر مشاريعك كـ ZIP.";
  document.body.insertBefore(b, document.getElementById("app"));
}

if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => { /* بلا ملف sw.js يعمل البرنامج عاديًا */ });

  </script>
